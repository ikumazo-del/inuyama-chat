<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ══ ①DL数カウンタ increment（謎の数字）══
//   保存が実際に発生した時だけ +1。await しない＝Firestore書込がオフライン等で詰まっても
//   保存（a.click）を人質に取らせない。increment はサーバ側アトミックゆえトランザクション不要。
function bumpDL() {
  try {
    if (!window._fs) return;  // 未初期化なら黙って無視
    window._fs.doc("counters/global")
      .set({ dl: firebase.firestore.FieldValue.increment(1) }, { merge: true })
      .catch(function () {});  // 書込失敗も握り潰す（本業＝保存を壊さない）
  } catch (e) { /* no-op */ }
}

// ── TNM data ──
const T_ITEMS = ["T0","Tis","T1","T2","T3","T4"];
const N_ITEMS = ["N0","N1mi","N1","N2","N3"];
const M_ITEMS = ["M0","M1"];
const T_DESC = {
  T0:"原発巣の証拠なし", Tis:"非浸潤癌（DCIS）または Paget 病（浸潤なし）",
  T1:"浸潤径 ≤ 20 mm（T1mi ≤1 / T1a ≤5 / T1b ≤10 / T1c ≤20 mm）",
  T2:"浸潤径 > 20 mm、≤ 50 mm", T3:"浸潤径 > 50 mm",
  T4:"胸壁または皮膚への浸潤（浸潤径に関わらずT4）",
};
const T4_SUB_DESC = {
  T4a:"胸壁への浸潤（肋骨・肋間筋・前鋸筋への固定）",
  T4b:"皮膚浮腫（peau d'orange）・皮膚潰瘍・同側皮膚衛星結節",
  T4c:"T4a＋T4bの両方を満たす",
  T4d:"炎症性乳がん（発赤・浮腫が皮膚の1/3以上）",
};
// 【v2.1.15】pN（手術病理の個数）を主軸に前面。臨床N（cN）は控えめに併記（副次注記）。
//   個数で表せない所見（cN2固定・融合／pN2b内胸のみ／pN3b内乳＋腋窩／pN3c鎖骨上）は
//   数値で殺さず、各行の「｜」以降に温存する（IwaoK決裁 2026-07-17・④の落とし所）。
const N_DESC = {
  N0:"転移なし（0個）", N1mi:"微小転移 0.2–2 mm（個数には数えない）",
  N1:"腋窩リンパ節転移 1–3個（pN1）｜臨床：可動性のある腋窩転移（cN1）",
  N2:"腋窩リンパ節転移 4–9個（pN2a）｜臨床：固定・融合、または内胸節のみ（cN2）",
  N3:"腋窩転移 10個以上（pN3a）／鎖骨下・鎖骨上・内乳＋腋窩（pN3b/c）",
};
const M_DESC = { M0:"遠隔転移なし", M1:"遠隔転移あり" };

// ══ §レイサマリー（患者向け.txt出力・v2.4.0）═══════════════════════════
//   B案＝アプリが患者語まで作り、8B(Qwen)は最終整形のみ（生成させない・§0の具現化）。
//   逐語厳守帯（薬剤名・年数・回数）はそのまま／医師フレーム（試験名・エビデンス・IITL注記）は患者版から落とす。
//   単一ソース：治療は treatment[] を読む（buildWordDocと同じstate・片肺を作らない・教訓16）。M0専用。
const LAY_SUBTYPE = {
  "HR+/HER2-": "女性ホルモンの影響で育つタイプ（ホルモン受容体陽性・HER2陰性）",
  "HR+/HER2+": "ホルモンとHER2、両方の性質をあわせもつタイプ（ホルモン受容体陽性・HER2陽性）",
  "HER2+":     "HER2というたんぱくが多いタイプ（HER2陽性・ホルモン受容体陰性）",
  "TNBC":      "3つの代表的な目印（ホルモン・HER2）がいずれも陰性のタイプ（トリプルネガティブ）",
};
const LAY_T = {
  Tis:"ごく初期の段階です（がんが広がる前の状態）",
  T1:"しこりは小さめです（およそ2cm以下）",
  T2:"しこりは中くらいの大きさです（およそ2〜5cm）",
  T3:"しこりはやや大きめです（およそ5cmをこえます）",
  T4:"しこりが皮膚や胸の壁におよんでいます",
};
const LAY_N = {
  N0:"わきのリンパ節への転移はありません",
  N1mi:"わきのリンパ節に、ごく小さな転移があります",
  N1:"わきのリンパ節に少し転移があります（1〜3個ほど）",
  N2:"わきのリンパ節に、やや多く転移があります",
  N3:"わきのリンパ節の広い範囲に転移があります",
};
const LAY_CLOSING = {
  "HR+/HER2-": "このタイプは比較的ゆっくり進むことが多く、飲み薬がよく効きます。あわてず、ご一緒に進めていきましょう。",
  "HR+/HER2+": "ホルモンとHER2の両方にはたらく手立てが揃っています。ご一緒に取り組んでいきましょう。",
  "HER2+":     "HER2をねらい撃ちする、効果の高いお薬があります。ご一緒に取り組んでいきましょう。",
  "TNBC":      "進みが速いことがある一方で、化学療法がよく効くタイプでもあります。手立てはあります。ご一緒に、一歩ずつ進めていきましょう。",
};
// 治療itemの縮約：薬剤名（逐語厳守帯）の先頭を必ず守る安全操作のみ。
//   ★「：」split はしない＝括弧内の回数「（温存後：残存乳房照射 16〜20回）」や「術前：薬剤名」の薬剤名を巻き込むため。
//   落とすのは末尾の試験名括弧・角括弧注記・evText断片のみ（先頭の薬剤名は不変）。
function laySimplifyTx(raw) {
  let s = String(raw == null ? "" : raw);
  s = s.split("\n")[0];                          // 複数行itemは1行目（薬剤の核）のみ＝evText埋め込み行を落とす
  s = s.replace(/【[^】]*】/g, "");                // 【根拠】【参考値】等の角括弧注記
  s = s.replace(/（[^（）]*試験）\s*$/g, "");       // 末尾の（○○試験）
  s = s.replace(/（[A-Za-z0-9\-]+）\s*$/g, "");    // 末尾の英数試験名括弧（KEYNOTE-522 等）＝薬剤商品名は日本語括弧ゆえ無傷
  return s.replace(/\s+$/, "").replace(/^\s+/, "");
}
// 患者版の治療素材から落とす行（medフレーム／明示的沈黙の注記）。
//   ★引数は「1行目を取り出した後の core」（evText独立要素と pending は呼び出し側で先に除外する）。
function isLayTxNoise(s) {
  if (!s) return true;
  if (/^※|^▸/.test(s)) return true;                                                // 補足・参考値の断片
  if (/記載を(行い)?ませ|範囲外のため|適格範囲外|オプションが変わります/.test(s)) return true;  // 明示的沈黙・保留の注記
  if (/^[─-]{2,}/.test(s)) return true;                                             // ── 区切り
  return false;
}

// ── Stage表記（患者版・v2.4.1）＝「ステージいくつ？」への直答。stageは stageLabel/anat の解剖学的ステージ ──
const LAY_STAGE = { "0":"0期（非浸潤）", IA:"IA期", IB:"IB期", IIA:"IIA期", IIB:"IIB期", IIIA:"IIIA期", IIIB:"IIIB期", IIIC:"IIIC期" };
//   「（早期）」の枕詞は 0/IA/IB/IIA のみ＝安心材料（IIB以降は素の番号のみ＝不用意な枕詞で不安にさせない・怖がらせない原則）
const LAY_STAGE_EARLY = { "0":1, IA:1, IB:1, IIA:1 };

// ══ §定義ブロック【v2.5.1】用語辞書（整形対象外＝gemmaは触らずそのまま載せる）══
//   思想（申し送り②§3）：モデルに定義させない。モデルが定義に触れる時にはもう正解が材料にある。
//   ・逐語の原典は一次に存在せず＝準拠平易化＋PITL監修（IwaoK 2026-08-17判断）。出典一行はブロック末尾に一括。
//   ・trigger（§3b）＝組み上げた本文に語が現れた時だけ、その定義を添える（buildLayGlossary）。順序＝pCR→HER2→センチネル。
//   ・整形対象外の担保は二層：ハーネスの「ことばの説明はそのまま載せて」＋この枠を本文末尾の別枠に置く物理分離。
const LAY_GLOSSARY = [
  { re: /pCR/, label: "pCR（病理学的完全奏効）",
    def: "手術の前に行うお薬の治療のあと、手術で取り出した組織を顕微鏡で調べたときに、体に広がる力を持ったがん（浸潤がん）が完全に消えている状態のことです。お薬がよく効いたことを示し、その後の再発が少ない傾向があります。" },
  { re: /HER2/, gate: "her2Positive", label: "HER2",
    def: "細胞の表面にあるタンパク質で、細胞が増えるための信号を伝える役割があります。このタンパク質が多く出ている乳がんを「HER2陽性乳がん」と呼び、HER2をねらい撃ちするお薬（トラスツズマブなど）による治療が行われます。" },
  { re: /センチネルリンパ節生検/, label: "センチネルリンパ節生検",
    def: "がんが最初に流れ着く「見張り役」のリンパ節を調べ、転移があるかどうかを確かめる検査です。多くは手術中に行います。ここに転移がなければ、脇の下のリンパ節を広く取る手術（腋窩リンパ節郭清）を省くことができ、術後の腕のむくみ（リンパ浮腫）などを減らせます。" },
];
// 本文（組み上げ済みテキスト）を走査し、出現した用語の定義だけを「ことばの説明」枠として返す（初出/重複の精緻化は追って）。
function buildLayGlossary(bodyText, ctx) {
  const hits = LAY_GLOSSARY.filter((g) => g.re.test(bodyText) && (!g.gate || (ctx && ctx[g.gate])));
  if (!hits.length) return null;
  const out = ["【ことばの説明】", "この説明の中で出てきたことばについて、補足しておきます。", ""];
  hits.forEach((g) => out.push("・" + g.label + "：" + g.def));
  out.push("");
  out.push("（日本乳癌学会 患者向けガイドラインに基づき平易化・IwaoK監修）");
  return out;
}
// ── 予後の○割丸め（IwaoK決裁 2026-08-11・問2）。保守的に下丸め＝過度な期待を防ぐ。est値を数字で断言しない。 ──
//   ★PFS_DATAの決裁済み実値（type:est/trial）を、決裁済みルールで写像するだけ（新たな数値決定はしない・HOTL）。
function pfsToLay(p) {
  const v = Number(p);
  if (!Number.isFinite(v)) return null;
  if (v >= 95) return "9割以上";
  if (v >= 90) return "およそ9割";
  if (v >= 85) return "8割半ば";
  if (v >= 80) return "およそ8割";
  return null;  // 80%未満は数値を伏せる（IwaoK決裁 2026-08-11 論点4・全サブタイプ共通・怖がらせない原則）
}
// ── 予後ブロックの行を生成（v2.4.2・IwaoK決裁 2026-08-11 論点1-4）。単一ソース＝PFS_DATA（write無し・読むだけ） ──
//   論点1: primaryTx で「実際に選んだ経路」の予後のみ（手術先行に術前予後を混ぜない）。
//   論点2: 術前療法＝pCR値を出し／non-pCRは数値を伏せて「治療をしっかり」。
//   論点3: TNBC(EFS)=「再発や新たながんなど大きな問題なく」／他(iDFS/DFS/RFS)=「再発なく」。
//   論点4: 80%以上のみ数値（pfsToLay が担保）／未満は伏せて前向き文。
function buildPrognosisLines(subtype, anat, primaryTx) {
  const table = PFS_DATA[subtype];
  if (!table || !anat || anat === "invalid" || !table[anat]) return [];
  const rows = table[anat];
  const evt = subtype === "TNBC" ? "再発や新たながんなど大きな問題なく経過される" : "再発なく経過される";
  const isSurgeryFirst = primaryTx === "手術";

  // ① 術前療法（HER2+/HR+HER2+/TNBC IIA以降）＝pCR/non-pCR枠組み。手術先行明示時は除く。pCR行が無ければ③へ落とす（TNBC IA等）。
  if (subtype !== "HR+/HER2-" && !isSurgeryFirst) {
    const pcrRow = rows.find((r) => /pCR/.test(r.label) && !/non-pCR/.test(r.label));
    if (pcrRow) {
      const pcrLay = pfsToLay(pcrRow.pfs);
      return pcrLay
        ? ["・手術の前のお薬でがんが消えた場合（pCRといいます）は、5年の時点で" + pcrLay + "の方が" + evt + "ことが期待されます。",
           "・がんが残った場合も、その後の治療をしっかり行うことで、再発を抑えていきます。"]
        : ["・手術の前のお薬でしっかり治療し、その効きを見ながら、再発を抑える治療を続けていきます。"];
    }
    // pCR行なし（TNBC IA＝化学療法あり/なし構造）→ ③へフォールスルー
  }

  // ② 手術先行を明示（HER2+/TNBC）＝手術先行/術後補助の単一値
  if (subtype !== "HR+/HER2-" && isSurgeryFirst) {
    const surgRow = rows.find((r) => r.req && r.req.surgeryFirst)
                 || rows.find((r) => /手術先行|APHINITY|手術 ＋ 術後補助|手術単独/.test(r.label))
                 || rows.find((r) => !/pCR/.test(r.label));
    const surgLay = surgRow ? pfsToLay(surgRow.pfs) : null;
    return surgLay
      ? ["・標準的な治療を行った場合、5年の時点で、" + surgLay + "の方が" + evt + "ことが期待されます。"]
      : ["・手術とお薬による治療をしっかり行うことで、再発を抑えていきます。"];
  }

  // ③「あり/なし」型（HR+/HER2- 全般、TNBC IA など pCR行なし）＝幅 or 単一 or 数値伏せ
  const withoutRow = rows.find((r) => /のみ|ET無|手術単独/.test(r.label));
  const withRow    = rows.find((r) => !/のみ|ET無|手術単独/.test(r.label));
  const withLay    = withRow ? pfsToLay(withRow.pfs) : null;
  const withoutLay = withoutRow ? pfsToLay(withoutRow.pfs) : null;
  if (withLay && withoutLay && withoutLay !== withLay) {
    const verb = subtype === "TNBC" ? "化学療法（点滴のお薬）を行うと" : "ホルモン療法（飲み薬）を行うと";
    return ["・" + verb + "、5年の時点で" + withLay + "の方が、行わない場合は" + withoutLay + "の方が、" + evt + "ことが期待されます。"];
  }
  if (withLay) return ["・標準的な治療を行った場合、5年の時点で、" + withLay + "の方が" + evt + "ことが期待されます。"];
  // 80%未満（進行期）＝数値を伏せて前向き文（論点4）
  return [(subtype === "HR+/HER2-" ? "・進んだ段階ですが、" : "・") + "手術とお薬による治療をしっかり行うことで、再発を抑えていきます。"];
}

// ── 術前（ネオアジュバント）の時系列フレーム（v2.5.0・IwaoK決裁 2026-08-15）──
//   治療見通しがカテゴリ順の羅列で「手術が先」に見え、gemma整形で治療がぼやける非対称を是正。
//   §0＝生成させず、primaryTx/pCR提示から決定論的に前置（HOTL）。薬剤名は下の逐語厳守帯が保持。
//   ・モダリティは確実な分だけ名指し、揺れる分は一般化（HER2+/TNBC=化学ベース確実で名指し／
//     Luminal=状態により内分泌単独もあり得るため「お薬による治療」に留める・IwaoK）。
//   ・T4＝術前療法後の手術可否を見極める段階＝手術を断言しない。T3以下＝手術を予定と明示（IwaoK決裁）。
const LAY_NEOADJ_MODALITY = {
  "HER2+":"化学療法と抗HER2療法", "HR+/HER2+":"化学療法と抗HER2療法",
  "TNBC":"化学療法と免疫療法",
  "HR+/HER2-":"お薬による治療",   // ★状態により内分泌単独もあり＝化学療法と断定しない（IwaoK 2026-08-15）
};
function layNeoAdjFrame(subtype, anat, primaryTx, activeT) {
  const explicitNeo = primaryTx === "術前化学療法" || primaryTx === "術前化学内分泌療法";
  // HER2+/HR+HER2+/TNBC は手術先行でなく pCR行があれば「術前提示」＝予後ブロックと同一トリガ（未選択の既定も含む）。
  let pcrPresented = false;
  if (subtype !== "HR+/HER2-" && primaryTx !== "手術") {
    const t = PFS_DATA[subtype], rows = t && anat && t[anat];
    pcrPresented = !!(rows && rows.find((r) => /pCR/.test(r.label) && !/non-pCR/.test(r.label)));
  }
  if (!explicitNeo && !pcrPresented) return null;
  const mod  = LAY_NEOADJ_MODALITY[subtype] || "お薬による治療";
  const tail = activeT === "T4"
    ? "を行い、効果を見ながら手術のタイミングを図ります。"   // T4＝手術可否を見極める（断言しない）
    : "を行い、その後に手術を予定します。";                  // T3以下＝手術を予定と明示
  return "・まず手術の前に、" + mod + "（術前薬物療法）" + tail;
}

// ══ §原則【v2.5.2】入力ボタンを省略せずレイサマリーに書き起こす（IwaoK決裁 2026-08-17）══
//   きっかけ：センチネル生検を選んでもレイサマリーに現れなかった＝lymphNode が buildSchedule（スケジュール層）
//   にだけ配線され、getTreatment（治療層）の侵襲がん手術行に配線されていなかった層間非対称。
//   原則：患者が選んだ入力ボタンは、レイサマリーの材料から落とさない（§0＝生成せず、確定した選択を決定論で運ぶ HOTL）。
//   実装は出力層（buildLaySummary）に置く＝getTreatment/PFS_DATA/audit.js/Word/HTML は無改変（Word/HTMLはスケジュール表で既に反映済）。
// ── リンパ節処理ボタン → レイサマリー行（決定論マッピング・入力パネル/CHIP_LYMPH の意味と一致）──
function layLymphLine(lymphNode) {
  switch (lymphNode) {
    case "センチネル生検": return "センチネルリンパ節生検";
    case "腋窩郭清":       return "腋窩リンパ節郭清";
    case "両方":           return "センチネルリンパ節生検（転移があれば腋窩リンパ節郭清）";  // 両方＝SNB陽性時に郭清（→の因果・CHIP_LYMPH準拠）
    case "なし":           return "リンパ節を取る手術は行いません（わきのリンパ節への転移の可能性が低いため省略します）";
    default:              return null;   // 未選択＝書き起こす対象なし
  }
}

// 患者向けテキスト組み立て。population と analysis を必ず本文に出す（＝集団ラベルと解析ステータスを構造で強制する）。
// 【v2.1.8】analysis を追加。「誰の値か」だけでなく「その値がどういう資格で出た値か」も落とさない（第5の偽装の禁止）。
function evText(key, mode) {
  const e = ADV_EVIDENCE[key];
  if (!e) return "";
  // 【v2.1.12】安全性エントリ（kind:"safety"）は「効果の参考値」テンプレートに載せない（＝同意説明の必須情報であり、
  //   効能・効果ごとの効果値ではない）。value=厳しい版（方向性）／short=簡略・重要点版（スケジュール）。
  //   evText(key,"short") で short を返す。★この分岐を消すと、ILDが「○○試験：」の効果値の顔で出てしまう。
  if (e.kind === "safety") return (mode === "short" && e.short) ? e.short : e.value;
  const warn = e.type === "est" ? "\n※ この数値は一次資料未確認です（担当医にご確認ください）" : "";
  return `【参考値】${e.trial}試験：${e.value}\n▸ この値の対象：${e.population}\n▸ この値の位置づけ：${e.analysis}${warn}`;
}
function getAnatomical(t, n, m) {
  if (!t || !n || !m) return null;
  if (m === "M1") return "IV";
  if (t === "Tis") return n === "N0" ? "0" : "invalid";
  if (n === "N3") return "IIIC";
  if (t === "T4") return "IIIB";
  if (n === "N2") return "IIIA";
  if (t === "T3" && (n === "N1" || n === "N1mi")) return "IIIA";
  if (t === "T3" && n === "N0") return "IIB";
  if (t === "T2" && n === "N1") return "IIB";
  if (t === "T2" && (n === "N0" || n === "N1mi")) return "IIA";
  if ((t === "T0" || t === "T1") && n === "N1") return "IIA";
  if ((t === "T0" || t === "T1") && n === "N1mi") return "IB";
  if (t === "T1" && n === "N0") return "IA";
  if (t === "T0" && n === "N0") return "invalid";
  return "invalid";
}

function getPrognostic(anat, er, pr, her2, grade) {
  if (!anat || anat === "invalid") return null;
  if (anat === "0" || anat === "IV") return anat;
  if (!er || !her2 || !grade) return null;
  const hr = er === "+" || pr === "+";
  const a = anat;
  if (her2 === "+") {
    return { IA:"IA",IB:"IA",IIA:"IIA",IIB:"IIB",IIIA:"IIIA",IIIB:"IIIB",IIIC:"IIIC" }[a] ?? a;
  }
  if (hr) {
    const tbl = {
      "1":{ IA:"IA",IB:"IA",IIA:"IA",IIB:"IB",IIIA:"IIA",IIIB:"IIIA",IIIC:"IIIB" },
      "2":{ IA:"IA",IB:"IA",IIA:"IB",IIB:"IIA",IIIA:"IIB",IIIB:"IIIA",IIIC:"IIIB" },
      "3":{ IA:"IB",IB:"IIA",IIA:"IIA",IIB:"IIB",IIIA:"IIIA",IIIB:"IIIB",IIIC:"IIIC" },
    };
    return tbl[grade]?.[a] ?? a;
  }
  return { IA:"IB",IB:"IIA",IIA:"IIA",IIB:"IIIA",IIIA:"IIIA",IIIB:"IIIB",IIIC:"IIIC" }[a] ?? a;
}

function getSubtype(er, pr, her2) {
  if (!er || !her2) return null;
  const hr = er === "+" || pr === "+";
  if (her2 === "+") return hr ? "HR+/HER2+" : "HER2+";
  return hr ? "HR+/HER2-" : "TNBC";
}

function isNPlus(n) { return n === "N1" || n === "N2" || n === "N3"; }
// 【v2.1.15】単一ソース化：nCount（N1の1-3/4+セグメント）を廃止。
//   陽性個数≥4 は nFromCount で N2(4–9)/N3(≥10) へ自動昇格するため、
//   「N1かつ4個以上」は構造的に生成不能＝旧 (N1 && "4+") 分岐は死にコード化。
//   よって isN4plus は「pN個数≥4＝N2/N3」と等価（IwaoK決裁 2026-07-17・③）。
//   N1ボタン＝1–3個 と定義が確定するので isN1to3 は N1mi/N1 で足りる。
function isN4plus(n) {
  return n === "N2" || n === "N3";
}
function isN1to3(n) {
  return n === "N1mi" || n === "N1";
}
function isAbemaciclib(n, t, grade, ki67) {
  if (isN4plus(n)) return true;   // ≥4個（N2/N3）
  // 1–3個（N1/N1mi）＋高リスク特徴が1つ以上：Grade3 / pT3以上(≥5cm相当) / Ki-67≥20%（monarchE cohort2）
  const ki67v = Number(ki67);
  if (isN1to3(n) && (grade === "3" || t === "T3" || t === "T4" || (Number.isFinite(ki67v) && ki67v >= 20))) return true;
  return false;
}
// 【v2.1.16】OncotypeDx適応：HR+/HER2−の保険適用範囲（N0/N1mi/N1）内で、
//   リスク特徴（N1＝1–3個の節転移 / 核Grade2-3 / Ki-67≥20%）のいずれかがあるとき作動。
//   ★N2/N3（腋窩4個以上）は日本の保険適用外＝背骨(保険準拠)に従い除外（IwaoK決裁 2026-07-17）。
//   ★Ki-67閾値は ≥20%（monarchE・ki67High表示と統一・IwaoK決裁 2026-07-17 3便目）。
function isOncotypeDxEligible(subtype, n, grade, ki67) {
  if (subtype !== "HR+/HER2-") return false;
  if (n === "N2" || n === "N3") return false;   // 腋窩4個以上＝保険適用外
  const ki67v = Number(ki67);
  return n === "N1" || grade === "2" || grade === "3" || (Number.isFinite(ki67v) && ki67v >= 20);
}
// ── POTENT(Toi 2021) N0適格ゲート ─────────────────────────────────────
// 出典: Toi, POTENT, Lancet Oncol 2021;22:74-84 ＋ 原著 appendix 2 p6（Claude現物照合 2026-07-20）。
// appendix原文「Intermediate to high recurrence risk by prior treatment status」の N0適格（1: 術後化療 or 術前薬物療法なし）:
//   (i) 浸潤径 ≥3cm ／ (ii) 組織学的Grade 3 ／ (iii) 明らかな脈管侵襲(evident vascular invasion)
//   (iv) Grade 2 かつ 浸潤径 ≥2–<3cm ／ (v) {Grade 2, ≥2–<3cm} の片方のみ ＋ 高増殖マーカー(中央判定)
//   2: 術前化学療法 → 術前化療"前"の細胞診/生検でLN陽性、または残存腫瘍あり（＝非pCR相当）
//   3: 術前内分泌療法 → 1)基準を満たす、または術前内分泌"前"にLN陽性なら1)によらず適格
//     ★アプリの初回治療方針は 手術／術前化学療法／術前化学内分泌療法 の3択＝純粋な術前内分泌がないため 3) は実装不要（2) に集約）。
// ★アプリ側の制約と割り切り（IwaoK決裁 2026-07-20）:
//   ・脈管侵襲(LVI)の入力軸を持たない → 軸は新設せず、LVIが"答えを変える枝"にだけ条件付き文言を出す（決裁A・下記kind:"lvi"）。
//   ・TはT2が2–5cmを跨ぎ「≥3cm」を単独で切れない。ただし(i)+(iv)の合わせ技で T2はG2以上なら径によらず適格 → 残る曖昧は T2×G1×低Ki-67 のみ。
//     そこは発火させたうえで但し書きを併記する（決裁B①：偽陽性のコストは"カンファレンスで検討"であり推奨ではないため許容）。
//   ・高増殖マーカーの閾値は原著に数値記載がない（中央判定の"high"のみ）→ 当施設基準 Ki-67 ≥20% を用い、POTENT非明示である旨を注記（決裁C／出典偽装の回避）。
//   ・T4は「常に適格」と簡略化（皮膚・胸壁浸潤＝臨床的高リスク）。原著の文字通りの基準は径・G・脈管ベースのため極小T4は厳密には非該当＝割り切り。
// ══ §0-8【v2.1.30】POTENT適格病期ゲート＝IIIC除外（IwaoK決裁 2026-07-24）══
//  ★発端：POTENT原著の適格病期は I–IIIB。この事実は v2.1.24 で PFS_DATA 側にのみ適用され
//    （L84/L159/L318 のコメント「IIICは適格外につき追加しない」）、治療方針側
//    （getTreatment の nPos 枝・buildSchedule の s1Add）には適用されていなかった＝層間の片肺。
//    同じ一つの事実が2つの層に別々の書き方で置かれ、片方にしか効いていなかった（教訓7）。
//  ★よって条件を各所へ書き足すのではなく、単一述語に集約して両層が同じものを参照する。
//  ★病期は【解剖学的】anat を見る。getPrognostic の補正後（HR+/HER2-・G1/G2 では IIIC→IIIB）を
//    見ると原著の適格集団と別物になる。getTreatment / buildSchedule はいずれも anat を受け取る。
//  ★安全側の倒し方向（§1-4と同型・変更禁止）：未知の anat は true（＝S-1を記載する）へ倒す。
//    false 側へ倒すと etEsc が落ち、Ki-67低値枝で「化学療法省略」の文言が出うる＝危険側。
//    ゆえにホワイトリストではなくブラックリスト（!== "IIIC"）で書く。
function isPotentStageEligible(anat) { return anat !== "IIIC"; }

// ══ §0-11【v2.1.38】KEYNOTE-522適格病期ゲート＝Stage I（IA/IB）除外（IwaoK決裁 2026-07-27）══
//  ★発端：TNBC の Stage IA に術前ペムブロ（KEYNOTE-522）が出ていた＝適格外への按分（教訓36）。
//    治療方針層（getTreatment TNBC枝）・スケジュール層（buildSchedule 術前TNBC枝）・予後層（PFS_DATA["TNBC"]["IA"]）の
//    3層すべてに病期ゲートが無かった。原著（Schmid P, et al. NEJM 2022;386:556-67・Claude現物照合 2026-07-26）の
//    適格集団は Stage II–III ＝ T1c N1–2 または T2–4 N0–2。★T1c N0 も N1–2 を要し適格外＝Stage I（IA/IB）は丸ごと対象外。
//  ★POTENT（§0-8）と同じ「単一述語・両層（＋予後層）が同じものを参照」の思想。ただし【倒し方向は逆】：
//    POTENT は未知 anat→true（S-1記載）が安全側だった（false だと Ki-67低値枝で「化学療法省略」文言が出る危険側）。
//    KEYNOTE-522 が塞ぐのは「ペムブロという強い上乗せ」であり、TNBC は Ki-67低値枝を持たない（subtype排他）。
//    ゆえに未知 anat を適格側へ倒すと「適格外への按分」を再生産する＝こちらでは true が危険側。
//    よって未知→false＝【ホワイトリスト】で書く（POTENT のブラックリストと非対称なのは、危険側が逆だから）。
//  ★残差（IwaoK決裁②・正直な記録 2026-07-27）：病期群ゲートゆえ T1a/T1b N1（Stage IIA だが原著は N1–2 で
//    T1c 以上を要求）が適格側に残る。原著厳密には適格外だが、アプリの粒度（anat 病期群）では拾えない稀な隅。
//    POTENT の粒度と同じ限界＝§7「照合キーの無い隅」を可視化として記録する。
//  ★病期は【解剖学的】anat を見る（getPrognostic 補正後ではない）。getTreatment / buildSchedule とも anat を受け取る。
//    予後層 PFS_DATA は静的データゆえ述語を通せない＝IA の KEYNOTE-522 行を【不在】で表現（POTENT の予後層と同型）。
//    将来 audit.js に AU-7「IA の PFS_DATA に KEYNOTE-522 ラベルが存在しないこと」を追加候補（【O】point1・要audit.js現物）。
function isKeynote522StageEligible(anat) { return ["IIA","IIB","IIIA","IIIB","IIIC"].includes(anat); }

// 返り値: {kind:"eligible"|"lvi"|"neoadj"|"none", caveat?:string}
function potentN0Eligibility(t, grade, ki67, primaryTx) {
  const ki67v = Number(ki67);
  const hi = Number.isFinite(ki67v) && ki67v >= 20;      // 当施設基準（POTENT非明示）
  if (primaryTx === "術前化学療法" || primaryTx === "術前化学内分泌療法") return { kind:"neoadj" };
  if (t === "T3" || t === "T4") return { kind:"eligible" };          // (i) ＋T4割り切り
  if (grade === "3") return { kind:"eligible" };                      // (ii)
  if (t === "T2") {
    if (grade === "2" || hi) return { kind:"eligible" };              // (iv)/(i)/(v)
    return { kind:"eligible", caveat:"ただし浸潤径2–3cm・Grade1・Ki-67低値の場合は原著の適格基準を満たさない可能性があります（本アプリのT2は2–5cmを含み径を細分できないため）" };
  }
  if (t === "T1") {
    if (grade === "2" && hi) return { kind:"eligible" };              // (v) G2単独＋高増殖
    if (grade === "2" || hi) return { kind:"lvi" };                    // (iii)でのみ適格になりうる枝
    return { kind:"none" };                                           // 低リスクT1は沈黙
  }
  return { kind:"none" };
}
// ── オラパリブ(OlympiA)術後補助適応判定 ──────────────────────────────
// 出典: JOHBOC 遺伝性乳癌卵巣癌GL 2024 乳癌CQ8 / Tutt NEJM2021 / Geyer AnnOncol2022。
// 大前提: gBRCA1/2病的バリアント陽性（アプリにBRCA入力軸なし→表示は常に「gBRCA+例」条件付き）。HER2陰性のみ。
// 化学療法の時期(術前=non-pCR前提／術後=手術先行)×サブタイプで再発高リスク定義が異なる。
// 返り値: null(非該当) | { ctx:"術前"|"術後", cond:"表示用の再発高リスク条件文" }
function olaparibEligibility(subtype, primaryTx, t, n) {
  if (subtype !== "TNBC" && subtype !== "HR+/HER2-") return null;   // OlympiAはHER2陰性のみ
  const isNeoAdj = primaryTx === "術前化学療法" || primaryTx === "術前化学内分泌療法";
  if (isNeoAdj) {
    // 術前化学療法後 = non-pCR前提（pCR達成例は非適応）
    return subtype === "TNBC"
      ? { ctx:"術前", cond:"non-pCR（乳房/腋窩に浸潤癌残存）" }
      : { ctx:"術前", cond:"non-pCR かつ CPS+EGスコア≥3" };   // HR+/HER2-
  }
  // 術後化学療法（手術先行）
  if (subtype === "TNBC")
    return (["T2","T3","T4"].includes(t) || isNPlus(n)) ? { ctx:"術後", cond:"pT2以上 または pN1以上" } : null;
  // HR+/HER2-: 腋窩リンパ節転移4個以上
  return isN4plus(n) ? { ctx:"術後", cond:"腋窩リンパ節転移4個以上" } : null;
}

// ── 【v2.1.29】エスカレーション属性の構造化（IwaoK決裁 2026-07-23）─────────────
//   v2.1.28 のゲートは ESCALATION_RX = /TS-1|アベマシクリブ|オラパリブ/ という
//   「薬剤名の文字列一致」だった。表記を変えた瞬間（TS-1→S-1、アベマシクリブ→ベージニオ）
//   ゲートが静かに外れ、画面は普通のまま矛盾だけが復活する＝「静かに壊れる」型。
//   ★教訓6の一般形：文字列一致もまた「条件の列挙」の一種であり、構造で守れていない。
//
//   本版で薬剤名はロジックから完全に降り、表示のためだけの文字列に戻った。
//   escalates は「その行を push したその場で」立てる＝書き手と読み手の間の翻訳層が消える。
//
//   ★ただしフラグ化そのものには同型の弱点が残る——「書き忘れが黙る」。
//     `escalates` は省略可能なので undefined は false として振る舞い、
//     新しい化学療法ブロックを足す人が1行書き忘れれば v2.1.28 以前の矛盾が復活する。
//     よって本版は「未記入を検出できること」までを同一版に含める（IwaoK決裁 2026-07-23）：
//       ① pushBlock 経由：escalates 省略を検出し、安全側（true）へ倒して _escUnset を立てる
//       ② ゲート計算時：生の res.push で書かれたブロックも同じ検査にかける（本命の網）
//     ★実行時の倒し方向は必ず true 側（＝「省略できません」）にすること。
//       失敗の向きが過剰な慎重さになる。false 側に倒すと化学療法省略の無言の許可になる。
//
//   ★スコープ【v2.1.32で拡大】＝res 経由の全10箇所。
//     旧（v2.1.29決裁 2026-07-23）＝安全性に関与する5箇所のみ：局所療法／内分泌療法＋補助薬物療法／
//     Oncotype DX／術前化学療法／化学療法（術後）。除外の根拠は「HER2+系・TNBC の push は
//     subtype 排他かつ【ゲートより後方】＝到達不能」だった。
//   ★v2.1.32 でこの根拠が失効した：finalize は関数末尾で res 全体を走査するため、
//     もはや「ゲートより後方」は存在しない。旗の無いブロックは全 subtype で _escUnset を立てる。
//     ＝旧決裁が予告していた「将来12箇所へ広げる」場面が来た（動機は規約統一ではなく、カナリアの生存）。
//   ★DCIS・M1 は res を使わず配列リテラルを return する＝finalize を通らないため対象外のまま。
//     これは【決めた沈黙】：保留ブロックを含まず escalating の消費者も居ない。旗のための旗は置かない。
function pushBlock(res, b) {
  // ★pending（未解決ブロック）は escalates を持たないのが正しい状態＝フォールバックの対象外。
  //   ここで true を立てると保留が自分自身をエスカレーションと数える（自己参照）。
  if (!b.pending && !('escalates' in b)) { b.escalates = true; b._escUnset = true; }   // 安全側フォールバック
  res.push(b);
  return b;
}

// ══ §0-10【v2.1.32】finalize 方式＝位置依存の撤去（案C／K-b・IwaoK決裁 2026-07-24）══
//  ★v2.1.28 以来、増殖能（Ki-67）ブロックは「res の最後尾に置くこと」という【散文の約束】で
//    守られていた。約束を破っても壊れ方は静かで、機械検査（旧AU-4）だけが位置を見ていた。
//    ＝教訓7の一般形「矛盾しえない書き方を探す」が、この一点だけ未適用で残っていた。
//  ★案C：結論を保留したまま push し、関数末尾の finalize で res 全体を見て確定する。
//    位置依存が【仕様から降りる】。isPotentStageEligible を単一述語にしたのと同じ思想の続き。
//  ★設計上の4つの決め（変更禁止・理由付き）：
//    ① finalize は items のテキストを読まない。解決に要る材料は保留ブロック自身が運ぶ
//       （level／band／odxUnknown）。res の文字列を読み直した瞬間、v2.1.29 で撤去した
//       ESCALATION_RX（薬剤名の文字列一致）が別の顔で戻ってくる。
//    ② escalating は保留ブロックを除いて数える（!o.pending）。自己参照の禁止。
//    ③ 解決後の増殖能ブロックには escalates:false を【明記】する。v2.1.31 まではフィールドごと
//       不在だった＝「誰も決めていない沈黙」。決めた false に変える（教訓8）。
//    ④ 未解決の pending が残ったら _pendingUnresolved を立てる＝旧AU-4（位置検査）の役目替え。
//       位置を見る意味は消えたが、見張りの数は減らさない。
//  ★残渣（正直に記録）：低値・escalating 枝の文言は「上記に…提示されています」と書く。
//    論理の位置依存は死んだが、【文言の位置依存】は残る。物理配置を末尾から動かすなら文言も直すこと。
function finalize(res) {
  // ① 未フラグ検査（本命の網）。pushBlock を使わず生の res.push を書いた場合もここで捕まる。
  //    捕まえたら安全側（true）へ倒し、_escUnset を立てて audit(AU-6) に渡す。
  res.forEach(o => { if (!o.pending && !('escalates' in o)) { o.escalates = true; o._escUnset = true; } });
  // ② エスカレーション判定（保留は自己参照になるため除外＝決め②）
  const escalating = res.some(o => !o.pending && o.escalates === true);
  // ③ 保留の解決
  res.forEach(o => { if (o.pending === "ki67") resolveKi67(o, res, escalating); });
  // ④ 未解決残留検査＝AU-4'（決め④）。解決器を書き忘れた保留はここで音を立てる。
  res.forEach(o => { if (o.pending) o._pendingUnresolved = true; });
  return res;
}

// 増殖能（Ki-67）ブロックの解決器。o は {cat, pending:"ki67", level, band, odxUnknown}。
function resolveKi67(o, res, escalating) {
  const B = o.band;
  //   ★odxPending は現時点で【到達不能】＝カナリア枝として残置（IwaoK決裁 2026-07-23）。
  //     理由：OncoDX適格条件（N1 or Grade2/3 or Ki-67≥20）と Ki-67低値が同時成立する場合、
  //     N1→nPos で S-1、Grade2/3×N0→POTENT(eligible/lvi)で S-1 が必ず先に立つため
  //     escalating が真になり、本枝に到達しない（全19,840パターンで発火0件）。
  //     ゆえに「保険上ほぼ全例が未施行」という実情でも本文言が濫発する懸念は生じない。
  //     逆に本枝が発火し始めたら escalating が壊れた合図＝audit の検知対象とする（AU-5）。
  //   ★odxUnknown は保留ブロックが運んできた構造値。items の文字列からは決して読まない（決め①）。
  const odxPending = o.odxUnknown === true && res.some(x => x.cat === "Oncotype DX（ゲノム検査）");
  o.items = [
    o.level === "high"
      ? `Ki-67高値（${B}）：Luminal B様。化学療法の上乗せを考慮`
    : o.level === "mid"
      ? `Ki-67中間域（${B}）：この範囲のKi-67は単独では治療選択の根拠になりません（IKWG 2021）。腫瘍径・Grade・リンパ節・Oncotype DX等と併せてご判断ください`
    : escalating
      ? `Ki-67低値（${B}）：増殖能は低値ですが、本症例には他の再発リスク因子（腫瘍径・Grade・POTENT適格等）があり、上記に化学療法／薬剤上乗せの候補が提示されています。Ki-67低値のみを根拠に化学療法を省略することはできません。総合判断（IITL）に委ねます`
    : odxPending
      ? `Ki-67低値（${B}）：Luminal A様。ただしOncotype DXが未施行のため、化学療法の省略可否はRS結果を待ってご判断ください（未施行のまま省略を判断する場合は、その旨をカンファレンス記録に残してください）`
      : `Ki-67低値（${B}）：Luminal A様。内分泌療法主体（化学療法省略を考慮）`
  ];
  o.escalates = false;   // ★決め③：増殖能の記述は上乗せの提示ではない＝【決めた false】
  delete o.pending; delete o.level; delete o.band; delete o.odxUnknown;
}

      const etDetail = postMeno
        ? "アロマターゼ阻害薬（レトロゾール、アナストロゾール、エキセメスタン）5〜10年"
        : preMeno
        ? "タモキシフェン 5〜10年（閉経前標準）／高リスク例：卵巣機能抑制（LH-RHアゴニスト）＋タモキシフェン または AI（SOFT/TEXT）"
        : "タモキシフェン または アロマターゼ阻害薬（閉経状況により選択）";
      pushBlock(res, { cat:"内分泌療法（ER/PR陽性例に追加）", escalates:false, items:[etDetail] });
    }
  }

  if (subtype === "TNBC") {
    // 【v2.1.38・IwaoK決裁 2026-07-27・決裁①(A)】KEYNOTE-522 適格病期ゲート（Stage II–III のみ／Stage I 除外）。
    //   ★M1（isAdv）は上流で早期 return 済＝ここは M0 TNBC のみ（anat ∈ IA/IB/IIA/IIB/IIIA/IIIB/IIIC）。
    if (isKeynote522StageEligible(anat)) {
      // 【v2.1.3】オラパリブ: OlympiA(JOHBOC CQ8)適応に厳密化。TNBC術後=pT2以上orpN1以上／術前=non-pCR。
      // 【v2.1.41】カペシタビン(CREATE-X)併用不可の注記は術前(non-pCR)のみ＝手術先行(ctx"術後")では
      //   non-pCR非発生でCREATE-X非該当のため olaparibEligibility の ctx で自動的に外す（IwaoK決裁 2026-07-28）。
      const olaEligTN = olaparibEligibility(subtype, primaryTx, t, n);
      const olaNoteTN = olaEligTN
        ? `オラパリブ（リムパーザ）1年：gBRCA1/2変異陽性・${olaEligTN.cond}の例（OlympiA試験）※ BRCA検査が必要${olaEligTN.ctx === "術前" ? "／カペシタビンとは併用不可・どちらか一方を選択" : ""}`
        : null;
      if (primaryTx === "手術") {
        // 【v2.1.41】手術先行TNBC（Stage II–III）＝術前療法(KEYNOTE-522ペムブロ)は術前開始が前提のため非該当。
        //   術後補助化学療法(EC→パクリタキセル)を提示＝スケジュール層(buildSchedule 術後化学療法行)と対称
        //   ＝層間非対称の是正（従来は isKeynote522StageEligible のみで術前レジメンを手術先行にも表示・IwaoK決裁 2026-07-28）。
        //   ★免疫療法は無いので cat に "＋ 免疫療法" を付けない＝出典偽装の回避（Stage I枝・L1246 と同型）。
        //   ★カペシタビン(CREATE-X)は non-pCR 前提＝手術先行では非該当のため画面には出さない（理由はここに記録＝決めた不在）。
        const items = ["EC療法（エピルビシン＋シクロホスファミド）→ パクリタキセル（術後4〜6週〜 約半年）"];
        if (olaNoteTN) items.push(olaNoteTN);
        pushBlock(res, { cat:"化学療法（術後補助）", escalates:true, items });
      } else {
        // 術前化学療法（＝isNeoAdj）／未選択（デフォルト）＝TNBC Stage II–III の原則（術前ペムブロ）を提示。
        const items = ["術前：ペムブロリズマブ（キイトルーダ）＋ タキサン＋カルボプラチン → アンスラサイクリン（KEYNOTE-522）","術後：ペムブロリズマブ継続（1年）","術前でpCR未達の場合 → カペシタビン追加を考慮"];
        if (olaNoteTN) items.push(olaNoteTN);
        pushBlock(res, { cat:"化学療法 ＋ 免疫療法", escalates:true, items });
      }
    } else {
      // 【v2.1.38・決裁①(A)】Stage I（IA/IB）は KEYNOTE-522 適格範囲外。
      //   ★POTENT の IIIC は isHighRisk 経由で化学療法ブロックが残ったが、M0 TNBC の全身療法ブロックは
      //     この1個だけ＝単純沈黙は Stage I TNBC の全身療法提示ごと消す。ゆえに Stage I 用の全身療法枠へ差し替え
      //     （空白を作らない）＋ KEYNOTE-522 の明示的沈黙注記を1本（＝出さないと決めた事実と理由を残す・POTENT同型）。
      //   ★免疫療法（ペムブロ）は無いので cat は「化学療法」（"＋ 免疫療法" を付けない＝出典偽装の回避）。
      const items = [
        "術後補助化学療法（TC または AC→T）：T1cN0 では標準的に考慮（ただし特殊組織型では推奨されない場合があります）",
        "T1a・T1bN0（腫瘍径 ≤1cm・リンパ節転移なし）：術後補助化学療法は推奨されません",
        "KEYNOTE-522（術前ペムブロリズマブ）は Stage II–III（T1c N1–2 または T2–4 N0–2）が適格範囲であり、本症例（Stage I）は適格範囲外のため記載しません"
      ];
      const olaEligTN = olaparibEligibility(subtype, primaryTx, t, n);
      // 【v2.1.41】カペシタビン併用不可は術前(non-pCR)のみ＝ctxで出し分け（Stage IはUI上手術先行のみ＝ctx"術後"だが式は共通化）。
      if (olaEligTN) items.push(`オラパリブ（リムパーザ）1年：gBRCA1/2変異陽性・${olaEligTN.cond}の例（OlympiA試験）※ BRCA検査が必要${olaEligTN.ctx === "術前" ? "／カペシタビンとは併用不可・どちらか一方を選択" : ""}`);
      pushBlock(res, { cat:"化学療法", escalates:true, items });
    }
  }

  return finalize(res);
}

// ── Treatment Schedule ────────────────────────────────────────────────
function buildSchedule(primaryTx, subtype, surgery, lymphNode, menopause, anat, n, t, grade, ki67) {
  const isNeoAdj   = primaryTx === "術前化学療法";
  const isNeoAdjHR = primaryTx === "術前化学内分泌療法";
  const isHER2     = subtype === "HER2+" || subtype === "HR+/HER2+";
  const isHR       = subtype === "HR+/HER2-" || subtype === "HR+/HER2+";
  const isTNBC     = subtype === "TNBC";
  const isK522Elig = isKeynote522StageEligible(anat);   // 【v2.1.38】Stage II–III のみ true（Stage I 除外・getTreatment と同一述語）
  const isLuminal  = subtype === "HR+/HER2-" || subtype === "HR+/HER2+";
  const hasSLNB    = lymphNode === "センチネル生検" || lymphNode === "両方";
  const isBreastCon = surgery === "温存";
  const postMeno   = menopause === "閉経後";
  const preMeno    = menopause === "閉経前";
  // 【v2.1.4】Stage IV(M1)判定を anat 基準に統一。従来は surgery==="非手術（薬物療法）" だけで緩和枝に入れており、
  //  ・M1で術式(温存/全摘)を選ぶと「手術先行＝術後補助療法」枝に落ちる
  //  ・M1で術前化学療法を選ぶと「術前化学療法（手術前提）」枝に落ちる
  //  という層間矛盾（getTreatmentは anat==="IV" で緩和的1次治療を返す）が起きていた。
  //  isPalliative を新設し、if連鎖の最上流（DCISの次）で判定する。M0の非手術（高齢・寝たきり・皮膚浸潤等）も同枝でOK（IwaoK判断）。
  const isAdv        = anat === "IV";
  // 【v2.1.33】第2項 surgery === "非手術（薬物療法）" を撤去（IwaoK決裁 2026-07-24）。
  //   ★M0の選択肢から「非手術（薬物療法）」を削除したため、この項は M0 では永久に偽になった。
  //     M1は isAdv で守られる（L~1775 で isM1 は非手術に強制設定されるが、isAdv が真なので第2項に依存しない）。
  //   ★不採用の記録：第2項を「残して死なせる」案も検討したが、選択肢から消えた値を条件に残すと
  //     教訓14（定義から切り離された記号＝中身のない在庫）になる。ここは実体を消す。取り下げの理由は上流UI注記に残す。
  const isPalliative = isAdv;
  // 内分泌療法の中身（閉経状態で分岐しOFSを整合。閉経前にAI単独を出さない＝層①getTreatmentと一致）
  const etAdjContent =
    postMeno ? "アロマターゼ阻害薬（レトロゾール等）5〜10年"
    : preMeno ? "タモキシフェン 5〜10年（閉経前標準）\n高リスク例：卵巣機能抑制(OFS：LH-RHアゴニスト)＋タモキシフェン または AI（SOFT/TEXT）"
    : "閉経状況により選択：閉経後=AI／閉経前=タモキシフェン±卵巣機能抑制(OFS)";
  // アベマシクリブ(monarchE)はHR+/HER2-限定かつ高リスク(monarchE基準)のみ。HER2陽性・低リスク(IA〜IIBのN0/N1(1-3)非高リスク)には付与しない。
  const abemaAdd = (subtype === "HR+/HER2-" && isAbemaciclib(n, t, grade, ki67))
    ? "\n高リスク：アベマシクリブ2年追加（monarchE基準）"
    : "";
  // 【v2.0.8】S-1をスケジュールにも配線（説明文getTreatmentとの非対称を解消）。HR+/HER2-・N1以上のみ。
  // 【v2.1.30】同じ POTENT 適格病期ゲートを適用（IIIC除外）。ここを外すと v2.0.8 で解消した
  //   getTreatment との非対称が復活する。★理由の文言はここには置かない：
  //   スケジュール表は「いつ何をするか」の層であり、非該当の理由は「治療の方向性」欄の
  //   明示的沈黙注記に一本化する（＝決めた沈黙。IwaoK決裁 2026-07-24）。
  const s1Add = (subtype === "HR+/HER2-" && isNPlus(n) && isPotentStageEligible(anat))
    ? "\n中〜高リスク（N1以上）：TS-1（テガフール・ギメラシル・オテラシルカリウム）1年 追加を考慮（POTENT試験）"
    : "";
  // 【v2.1.3】オラパリブ(OlympiA/JOHBOC CQ8)をスケジュールにも配線。olaparibEligibilityで適応判定し各ホーム行に注記。
  //  HR+はアベマシクリブと、TNBC(非pCR)はカペシタビンと、それぞれ併用不可（択一）。gBRCA+前提・要BRCA検査。
  const olaElig = olaparibEligibility(subtype, primaryTx, t, n);
  const olaAltPartner = subtype === "HR+/HER2-" ? "アベマシクリブ" : "カペシタビン";
  // 【v2.1.41】手術先行TNBC（ctx"術後"）＝non-pCR非発生でカペシタビン(CREATE-X)非該当のため「〜とは併用不可」を出さない。
  //   HR+はアベマシクリブ(monarchE)が術後補助で併存しうる＝注記を残す。TNBC術前(non-pCR)も残す（治療方針層と対称・IwaoK決裁 2026-07-28）。
  const olaPartnerNote = (subtype === "TNBC" && olaElig && olaElig.ctx === "術後") ? "" : `・${olaAltPartner}とは併用不可`;
  const olaAdd = olaElig
    ? `\ngBRCA1/2変異陽性・${olaElig.cond}：オラパリブ（リムパーザ）1年も選択肢（OlympiA試験${olaPartnerNote}／要BRCA検査）`
    : "";
  const rows = [];

  // ── DCIS(0)非浸潤がん分岐: 手術＋（温存なら放射線）＋（Luminalなら内分泌）のみ。術後化学・抗HER2は出さない ──
  if (anat === "0") {
    rows.push({ phase:"手術", period:"初回", content:`${surgery ?? "乳房手術（温存または全摘）"}${hasSLNB ? "\n±センチネルリンパ節生検" : (lymphNode === "なし" ? "\nリンパ節処理なし（センチネルリンパ節生検を省略）" : "")}`, color:"#fef3e2" });
    if (isBreastCon) rows.push({ phase:"放射線療法", period:"術後（適応時）", content:"温存術後：全乳房照射（再発リスク低減）", color:"#fff8e1" });
    // DCISはバイオマーカー非依存: isLuminalゲートを外し無条件で内分泌療法行を出す。ER陽性の断定も外す（v2.0.9・IwaoK合意済）
    rows.push({ phase:"内分泌療法", period:"術後〜5年", content:(preMeno ? "タモキシフェン（DCISの再発リスク低減）※閉経前はタモキシフェン。DCISではOFS+AIは行いません" : postMeno ? "アロマターゼ阻害薬 または タモキシフェン（DCISの再発リスク低減）" : "タモキシフェン または アロマターゼ阻害薬（閉経状況により選択）"), color:"#f3e8fb" });
    rows.push({ phase:"定期フォロー", period:"治療中〜以降", content:"定期診察・マンモグラフィ等の画像検査", color:"#f5f5f5" });
    return rows;
  }

  // ── 【v2.1.4】緩和的1次治療枝（Stage IV、および M0の非手術例）: 術前化学療法枝より先に判定する ──
  // 【v2.1.22・M1網羅原則（§0-2）】スケジュール（rows）は「薬剤名＋根拠試験名」のみに簡略化。
  //   数値・集団・解析ステータスは方向性（参考）に集約。ライン番号の免責も方向性側の M1_LINE_DISCLAIMER に一本化。
  if (isPalliative) {
    // M1で局所制御・症状緩和目的の手術を選んだ場合のみ手術行を出す（術後補助療法は出さない）
    if (isAdv && surgery && surgery !== "非手術（薬物療法）") {
      rows.push({ phase:"手術（局所治療）", period:"適応時", content:`${surgery}\n遠隔転移がある場合の手術は、局所の症状をやわらげる・局所を抑える目的で行います（再発予防の「術後の追加治療」としては行いません）`, color:"#fef3e2" });
    }
    if (subtype === "HR+/HER2-") {
      // 【v2.1.8・§3-A/B】getTreatment側と対称に配線。無数値の主張を撤去し、一次確認済の値＋集団ラベル＋解析ステータスに置換。
      // 【★v2.1.12・plus-alpha（IwaoK決裁 2026-07-15）】スケジュールは「薬剤名＋根拠試験名」のみに簡略化。数値・集団・解析ステータス・外挿注記は方向性（参考）に集約（M1出力の重複解消）。★ILDだけは削れない側＝short版を残す。
      rows.push({ phase:"1次治療", period:"診断後〜", content:"内分泌療法 ＋ CDK4/6阻害薬（推奨）\n・AI（レトロゾール等）または タモキシフェン＋卵巣機能抑制\n・＋アベマシクリブ（ベージニオ）またはパルボシクリブ（イブランス）\n根拠：MONARCH 3／PALOMA-2\n※数値・閉経前の外挿の注記は「治療の方向性（参考）」をご覧ください", color:"#e8f0fb" });

      //   OlympiAD対照群＝単剤化学療法。よってオラパリブはこの行（化学療法の代わり）であり、1次・2次には置かない。
      // 【v2.1.9・§3-A-1】OLYMPIAD_HRSUB がこの層だけ欠落していた（getTreatment 側にはある＝片肺）。

      //   DB-06（化学療法歴なし）とDB-04（化学療法歴あり）は別の効能・効果＝別の行として書く。混ぜない。
      rows.push({ phase:"化学療法（耐性後）", period:"2次治療後 進行時", content:"HER2低発現・HER2超低発現：トラスツズマブ デルクステカン（エンハーツ）＝3週間ごとの点滴\n・内分泌療法後・化学療法歴なし（根拠：DESTINY-Breast06）\n・化学療法歴あり（根拠：DESTINY-Breast04）\n単剤化学療法：パクリタキセル、エリブリン（ハラヴェン）等\nダトポタマブ デルクステカン（ダトロウェイ）\ngBRCA1/2変異陽性例：オラパリブ（リムパーザ）／タラゾパリブ（ターゼナ）＝内服単剤（根拠：OlympiAD）\n" + evText("DB_ILD_LOW","short") + "\n※各薬剤の数値・対象集団・HER2超低発現の注意（効果は確定していません）は「治療の方向性（参考）」をご覧ください", color:"#f0e8fb" });
    } else if (subtype === "HER2+" || subtype === "HR+/HER2+") {

      rows.push({ phase:"2次治療", period:"1次治療後 進行時", content:"トラスツズマブ デルクステカン（エンハーツ）：T-DXd\n根拠：DESTINY-Breast03\n" + evText("DB_ILD_HER2POS","short"), color:"#ddeeff" });
      // 【v2.1.7・§3-B】数値なしの主張「脳転移例にも有効」を撤去し、一次確認済の値＋集団ラベルに置換。getTreatment側と対称に配線。
      // 【★v2.1.11・§3-B-1/B-2】getTreatment側と対称に配線（「3次治療は臨床的配置」注記・14日処方制限）。
      rows.push({ phase:"3次治療（参考）", period:"2次治療後 進行時", content:"ツカチニブ（ツカイザ）＋ トラスツズマブ ＋ カペシタビン\n2026年2月 日本承認／2026年4月 発売\n根拠：HER2CLIMB\n※数値・脳転移のデータ・「3次治療」の位置づけ・14日処方制限は「治療の方向性（参考）」をご覧ください", color:"#f0e8fb" });
    } else {
      rows.push({ phase:"1次治療", period:"診断後〜", content:"化学療法 ± 免疫療法\n・ペムブロリズマブ（キイトルーダ）＋ ナブパクリタキセル等（PD-L1陽性 CPS≥10）\n・PD-L1陰性例：アントラサイクリン系・タキサン系\n【根拠】KEYNOTE-355試験\n・CPS<10でも SP142 IC≥1% 陽性：アテゾリズマブ（テセントリク）＋ ナブパクリタキセル　根拠：IMpassion130（正式検定なし＝方向性参照）", color:"#e8f0fb" });
      // 【v2.1.7・§3-A】getTreatment側（2次治療以降カテゴリ）と対称に配線。HER2+/HR+は両層に値があるのにTNBCだけ片肺だった層間非対称を解消。
      // 【v2.1.9・§3-A-2】gBRCA陽性例の PARP阻害薬に数値が付いていなかった（getTreatment 側にはあった＝片肺）。
      //   「選択肢になります」と書いた薬には、値・集団・解析ステータスを必ず添える。getTreatment 側（2次治療以降カテゴリ）と同じ配線に揃えた。

      rows.push({ phase:"2次治療以降", period:"1次治療後 進行時", content:"サシツズマブ ゴビテカン（トロデルビ）：抗TROP-2 ADC（2024年9月 日本承認）\n根拠：ASCENT\nHER2低発現＋化学療法歴あり：トラスツズマブ デルクステカン（エンハーツ）＝3週間ごとの点滴\n根拠：DESTINY-Breast04（HR陰性コホートは63例・検定外＝方向性参照）\nその他：エリブリン（ハラヴェン）、カペシタビン等\ngBRCA1/2変異陽性例：オラパリブ（リムパーザ）／タラゾパリブ（ターゼナ）＝内服単剤（根拠：OlympiAD）\n" + evText("DB_ILD_LOW","short") + "\n※各薬剤の数値・対象集団は「治療の方向性（参考）」をご覧ください", color:"#ddeeff" });

    rows.push({ phase:"症状緩和ケア", period:"治療中〜継続", content:"疼痛（オピオイド等）・倦怠感・浮腫・皮膚の症状などのコントロール\n緩和ケアチームと連携", color:"#f0f8f0" });

  }

  if (isNeoAdjHR) {
    rows.push({ phase:"術前化学療法", period:"第1〜12週（EC療法）", content:"EC療法（エピルビシン＋シクロホスファミド）\n3週毎4サイクル", color:"#e8f0fb" });

    rows.push({ phase:"術前内分泌療法（追加時）", period:"化学療法終了後 2〜4か月", content:(postMeno ? "アロマターゼ阻害薬（レトロゾール等）" : "LH-RHアゴニスト＋タモキシフェン等") + "\n※化学療法単独で手術の場合もあり", color:"#f3e8fb" });
    rows.push({ phase:"手術", period:"術前治療終了後 約4〜6週", content:`${surgery ?? "乳房手術"}${hasSLNB ? "\n＋センチネルリンパ節生検" : ""}${lymphNode === "腋窩郭清" || lymphNode === "両方" ? "\n＋腋窩リンパ節郭清（適応時）" : ""}`, color:"#fef3e2" });
    rows.push({ phase:"術後内分泌療法", period:"術後〜5〜10年", content:(postMeno ? "アロマターゼ阻害薬継続（合計5〜10年）" : preMeno ? "タモキシフェン（±卵巣機能抑制OFS）継続（合計5〜10年）\n高リスク例：OFS＋タモキシフェン または AI（SOFT/TEXT）" : "タモキシフェン または アロマターゼ阻害薬（閉経状況により選択）") + abemaAdd + s1Add + olaAdd, color:"#f3e8fb" });
    if (isBreastCon) rows.push({ phase:"放射線療法", period:"術後（適応時）", content:"温存術後：全乳房照射\n断端陽性・リスク高：追加照射", color:"#fff8e1" });
  } else if (isNeoAdj) {
    if (isHER2) {
      rows.push({ phase:"術前化学療法", period:"第1〜12週", content:"パクリタキセル（3週毎または毎週）\n＋トラスツズマブ＋ペルツズマブ（HP療法・3週毎）", color:"#e8f0fb" });
      rows.push({ phase:"術前化学療法", period:"第13〜24週", content:"EC療法（エピルビシン＋シクロホスファミド）\n※抗HER2療法は休止", color:"#e8f0fb" });
    } else if (isTNBC && isK522Elig) {

      //   ペムブロを併用しない標準的な術前化学療法（EC→T）を提示し、沈黙の理由を1行残す（getTreatment と対称・層間非対称の回避）。

      //   ★復活条件：showNeoAdj から Stage I TNBC の封鎖（isKeynote522StageEligible ゲート）を外す新エビデンスが出たとき。
      //     そのときは下の3行の // を外すだけでよい（EC→T＋KEYNOTE-522 明示的沈黙注記＝getTreatment と対称）。
      //   ★双子の死にコード：術後療法の `else if (isTNBC)`（経過観察／カペシタビン CREATE-X）も同一ゲートで到達不能。
      //     本版では IwaoK 指定どおり術前枝のみコメント化し、術後枝は生かしたまま残置（§16【死にコード】要決裁：術後枝も同様に潰すか）。
      // rows.push({ phase:"術前化学療法", period:"第1〜12週", content:"パクリタキセル（3週毎）", color:"#e8f0fb" });
      // rows.push({ phase:"術前化学療法", period:"第13〜24週", content:"EC療法（エピルビシン＋シクロホスファミド）", color:"#e8f0fb" });
      // rows.push({ phase:"※注記", period:"—", content:"KEYNOTE-522（ペムブロリズマブ併用）は Stage II–III が適格範囲のため、本症例（Stage I）では併用しません", color:"#fff8e1" });
    } else {
      rows.push({ phase:"術前化学療法", period:"第1〜24週", content:"担当医と相談の上、最適なレジメンを決定", color:"#e8f0fb" });
    }
    rows.push({ phase:"手術", period:"化学療法終了後 約4〜6週", content:`${surgery ?? "乳房手術"}${hasSLNB ? "\n＋センチネルリンパ節生検" : ""}${lymphNode === "腋窩郭清" || lymphNode === "両方" ? "\n＋腋窩リンパ節郭清（適応時）" : ""}`, color:"#fef3e2" });
    if (isHER2) {
      rows.push({ phase:"術後療法", period:"術後（pCR達成）", content: isNPlus(n) ? "トラスツズマブ＋ペルツズマブ（HP療法）継続（合計1年完了まで）" : "トラスツズマブ継続（合計1年完了まで）", color:"#e8f7ee" });
      rows.push({ phase:"術後療法", period:"術後（pCR未達成）", content:"T-DM1（カドサイラ）14サイクル（KATHERINE試験）", color:"#fdeaea" });
    } else if (isTNBC && isK522Elig) {
      rows.push({ phase:"術後療法", period:"術後（pCR達成）", content:"ペムブロリズマブ継続（術前分と合計1年）", color:"#e8f7ee" });
      rows.push({ phase:"術後療法", period:"術後（pCR未達成）", content:"カペシタビン（8サイクル）\n＋ペムブロリズマブ継続" + olaAdd, color:"#fdeaea" });
    } else if (isTNBC) {
      // 【v2.1.38・決裁①(A)】Stage I（IA/IB）TNBC＝KEYNOTE-522 適格範囲外＝ペムブロ継続なし。
      //   pCR達成は術後経過観察、non-pCR はカペシタビン（CREATE-X）。olaAdd は gBRCA+ 時のみ付与（挙動不変）。
      rows.push({ phase:"術後療法", period:"術後（pCR達成）", content:"術後は経過観察（追加の薬物療法は行いません）", color:"#e8f7ee" });
      rows.push({ phase:"術後療法", period:"術後（pCR未達成）", content:"カペシタビン（8サイクル）（CREATE-X）" + olaAdd, color:"#fdeaea" });
    }
    if (isHR) rows.push({ phase:"内分泌療法", period:"術後〜5〜10年", content:etAdjContent + abemaAdd + s1Add + olaAdd, color:"#f3e8fb" });
    if (isBreastCon) rows.push({ phase:"放射線療法", period:"術後（適応時）", content:"温存術後：全乳房照射", color:"#fff8e1" });
  } else {
    rows.push({ phase:"手術", period:"初回", content:`${surgery ?? "乳房手術"}${hasSLNB ? "\n＋センチネルリンパ節生検" : ""}${lymphNode === "腋窩郭清" || lymphNode === "両方" ? "\n＋腋窩リンパ節郭清（適応時）" : ""}`, color:"#fef3e2" });
    if (subtype !== "HR+/HER2-") {
      // 【v2.1.39・Request3(IwaoK 2026-07-27)】手術先行（術後化学療法）枝。TNBC の Stage I は pCR 概念が存在しない
      //   （術前療法なし）ため「pCR未達相当時：カペシタビン追加」を除去。Stage II–III（isK522Elig）は不変。
      //   ★【v2.1.40・IwaoK決裁 2026-07-28（§16【R】）】上記残差を解消。手術先行（術前療法なし）では Stage II–III でも
      //     pCR が発生しないため「pCR未達相当時：カペシタビン追加」は病態論理上つねに不整合＝削除した。
      //     手術先行 TNBC の術後化学療法は Stage I/II–III とも EC→パクリタキセル（Stage I のみ TC も選択肢）。
      //     olaAdd（gBRCA+・OlympiA 術後 pT2+/pN1+）は術後設定でも適格ゆえ残置。カペシタビン（術後・術前療法なし）は
      //     CREATE-X（術前化学療法後の非pCR が対象）に該当せず＝手術先行での根拠なし。
      rows.push({ phase:"術後化学療法", period:"術後4〜6週〜 約半年", content: isHER2 ? "EC療法→パクリタキセル＋" + (isNPlus(n) ? "トラスツズマブ＋ペルツズマブ" : "トラスツズマブ（＋ペルツズマブ）") + "\nトラスツズマブ合計1年" : (isTNBC && isK522Elig) ? "EC療法→パクリタキセル" + olaAdd : isTNBC ? "EC療法→パクリタキセル（TC も選択肢）" + olaAdd : "EC療法→パクリタキセル（適応例）", color:"#e8f0fb" });
    } else {
      rows.push({ phase:"術後化学療法", period:"術後（適応時）", content:"Ki-67・Oncotype DXスコア等により判断\n高リスク：EC→パクリタキセル", color:"#e8f0fb" });
    }
    if (isHER2) rows.push({ phase:"術後抗HER2療法", period:"合計1年", content: isNPlus(n) ? "トラスツズマブ＋ペルツズマブ" : "トラスツズマブ（＋ペルツズマブ）", color:"#e8f7ee" });
    if (isHR) rows.push({ phase:"内分泌療法", period:"〜5〜10年", content:etAdjContent + abemaAdd + s1Add + olaAdd, color:"#f3e8fb" });
    if (isBreastCon) rows.push({ phase:"放射線療法", period:"術後（適応時）", content:"温存術後：全乳房照射", color:"#fff8e1" });
  }

  if (!isPalliative) {
    rows.push({ phase:"定期フォロー", period:"治療中〜以降", content:"定期診察・血液検査・画像検査\n副作用・再発の早期発見", color:"#f5f5f5" });
  }
  return rows;
}

// ── 5年PFSパネル ──────────────────────────────────────────────────────
function PfsPanel({ anat, subtype, menopause, primaryTx, surgery, n, t, grade, ki67 }) {
  const [expanded, setExpanded] = useState(true);
  if (!anat || !subtype || anat === "invalid" || anat === "IV" || anat === "0") return null;
  // 閉経状態フラグ（Unit 2で閉経前HR+レジメンの出し分けに使用）
  const preMeno  = menopause === "閉経前";
  const postMeno = menopause === "閉経後";
  const menoUnset = !menopause;               // 7: 未選択時は閉経後に準拠
  // 閉経前 HR+/HER2- は専用データ（OFS基盤）に丸ごと差し替え。該当なければ通常データ。
  const usePremeno = preMeno && subtype === "HR+/HER2-" && !!PFS_DATA_PREMENO[subtype]?.[anat];
  const rawData = usePremeno ? PFS_DATA_PREMENO[subtype][anat] : PFS_DATA[subtype]?.[anat];
  if (!rawData || rawData.length === 0) return null;

  // ── 根っこ①: primaryTx/surgery/N を反映した表示制御 ──
  const nPos = isNPlus(n);                                          // N1/N2/N3
  const isSurgeryFirst = primaryTx === "手術";                       // 手術先行
  const isIII = ["IIIA","IIIB","IIIC"].includes(anat);             // Swain分岐対象病期

  // N条件フィルタ: req.nPlus の行（S-1等）はN+のときのみ表示（N0/低リスクで非表示）
  // 【v2.1.42・Pending【T】】req.surgeryFirst の行（手術先行TNBC術後補助）は primaryTx==="手術" のときのみ表示。
  //   ＝治療方針層(getTreatment TNBC枝 primaryTx==="手術")と同一述語で駆動＝層間対称（教訓42／S-1のreq.nPlusと同型ゲート）。
  const data = rawData.filter(item => {
    if (item.req?.nPlus && !nPos) return false;
    if (item.req?.surgeryFirst && !isSurgeryFirst) return false;
    return true;
  });
  // 【v2.1.25・B-lite】S-1行が「存在したがN0で落ちた」事実を検知。落ちたまま黙るのではなく注記で明示する（描画は下部）。
  //   出す条件は治療カタログ側のN0ゲート（potentN0Eligibility）と同一＝方向性欄と予後欄の言及非対称を解消する。
  //   ★低リスク（kind:"none"）では注記も出さない＝適格外の症例に不要な選択肢を想起させない。
  const s1Dropped = subtype === "HR+/HER2-" && !nPos && rawData.some(it => it.req?.nPlus);
  const s1HiddenNote = s1Dropped && potentN0Eligibility(t, grade, ki67, primaryTx).kind !== "none";
  // 【v2.1.3】オラパリブ(OlympiA/JOHBOC CQ8)iDFS行を適応成立時に動的注入（判断B: 適応を厳密化）。
  //  TNBC術後=pT2+/pN1+、HR+術後=腋窩4個以上、術前=non-pCR前提。値はサブグループ別4年iDFS(Fig2B)。
  const olaElig = olaparibEligibility(subtype, primaryTx, t, n);
  const dataWithOla = (olaElig && OLAPARIB_PFS[subtype]) ? [...data, ...OLAPARIB_PFS[subtype]] : data;
  if (dataWithOla.length === 0) return null;

  // 別枠タグ行（②単剤トラスツズマブ等）を主系列と分離
  const mainRows = dataWithOla.filter(it => it.tag !== "別枠");
  const altRows  = dataWithOla.filter(it => it.tag === "別枠");

  // 【v2.1.18】カタログ思想：症例に適応しない行も"値は残し"、目立つ「本症例は適応外」注釈を出す。
  //   行を隠すのではなく〈誰の値か〉を明示して誤読を防ぐ＝背骨の集団偽装対策と同じ精神。
  //   ※現状の対象はアベマ行のみ（PFSパネルでゲート無し＝常時表示のため）。S-1はreq.nPlusで非表示・olaparibは適応時のみ注入。
  const rowNotIndicated = (item) => {
    if (subtype === "HR+/HER2-" && item.label.includes("アベマシクリブ") && !isAbemaciclib(n, t, grade, ki67)) {
      return "本症例は適応外：monarchE基準（腋窩1–3個＋Grade3／pT3以上／Ki-67≥20%、または腋窩4個以上）を満たしません";
    }
    return null;
  };

  const maxPfs = 100;

  const pfsColor = (v) => {
    if (v >= 88) return { bar:"linear-gradient(90deg,#1a7a4a,#2aaa5a)", txt:"#1a6a3a" };
    if (v >= 75) return { bar:"linear-gradient(90deg,#3060aa,#4a80cc)", txt:"#2a508a" };
    if (v >= 60) return { bar:"linear-gradient(90deg,#8a5500,#bb8800)", txt:"#7a4a00" };
    return { bar:"linear-gradient(90deg,#992200,#cc3300)", txt:"#882200" };
  };

  // 1行ぶんのバー描画（主系列・別枠で共用）
  const renderBar = (item, i, isAlt) => {
    const { bar: barGrad, txt: txtCol } = pfsColor(item.pfs);
    const barW = `${item.pfs}%`;
    const notIndicated = rowNotIndicated(item);   // 本症例で適応外なら理由文字列
    // pCR枝の術前後レジメン分岐（Swain 2022, 4y EFS）: III期pCR=90(PH→H既定)にH→H/PH→PH内訳を併記
    const showSwain = isIII && item.label.includes("pCR") && item.pfs === 90;
    // 術前療法系の行を手術先行で選んでいる場合の参考注記
    const isNeoRow = item.label.includes("術前") || item.label.includes("pCR");
    const showSurgeryFirstNote = isSurgeryFirst && isNeoRow;
    return (
      <div key={(isAlt?"a":"m")+i} style={{
        background: isAlt ? "#fbf9f2" : "#fff",
        border: notIndicated ? "1.5px solid #e0a030" : item.type === "trial" ? "1.5px solid #bacede" : "1.5px dashed #ccd8e8",
        borderRadius:8, padding:"9px 12px",
        opacity: showSurgeryFirstNote ? 0.82 : 1,
      }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:5 }}>
          <div style={{ flex:1, paddingRight:10 }}>
            <span style={{ fontSize:12, color:"#222", fontWeight:600, lineHeight:1.5 }}>{item.label}</span>
            {notIndicated && (
              <span style={{ marginLeft:6, fontSize:10, background:"#e0820a", color:"#fff",
                borderRadius:3, padding:"1px 6px", fontWeight:800, verticalAlign:"middle" }}>本症例は適応外</span>
            )}
            {item.type === "trial" && (
              <span style={{ marginLeft:6, fontSize:10, background:"#2a6aaa", color:"#fff",
                borderRadius:3, padding:"1px 5px", fontWeight:700, verticalAlign:"middle" }}>RCT</span>
            )}
            {item.tp && (
              <span style={{ marginLeft:6, fontSize:10, background:"#eef2f8", color:"#40608a",
                border:"1px solid #cdd8e8", borderRadius:3, padding:"1px 5px", fontWeight:700, verticalAlign:"middle" }}>{item.tp}</span>
            )}
            {item.ref && (
              <span style={{ marginLeft:6, fontSize:10, background:"#fff3e0", color:"#9a5a00",
                border:"1px solid #f0d0a0", borderRadius:3, padding:"1px 5px", fontWeight:700, verticalAlign:"middle" }}>参考値</span>
            )}
            {isAlt && (
              <span style={{ marginLeft:6, fontSize:10, background:"#efe7d8", color:"#7a5a2a",
                border:"1px solid #ddc9a8", borderRadius:3, padding:"1px 5px", fontWeight:700, verticalAlign:"middle" }}>別枠</span>
            )}
          </div>
          <span style={{ fontSize:18, fontWeight:900, color:txtCol, minWidth:52, textAlign:"right", lineHeight:1 }}>
            {item.pfs}<span style={{ fontSize:11, fontWeight:600 }}>%</span>
          </span>
        </div>
        <div style={{ background:"#eaeff7", borderRadius:6, height:12, overflow:"hidden", marginBottom:4 }}>
          <div className="pfs-bar" style={{ "--bar-w": barW, height:"100%", borderRadius:6, width: barW, background: barGrad }} />
        </div>
        {notIndicated && (
          <div style={{ fontSize:11, color:"#7a4400", background:"#fff2d8", border:"1.5px solid #e0a030",
            borderRadius:5, padding:"5px 9px", marginBottom:4, lineHeight:1.6, fontWeight:600 }}>
            ⚠️ {notIndicated}<br />

// ══ §UI【v2.2.0】固定サマリーのチップ用・表示専用ラベル（内部stateは非介入・IwaoK決裁 2026-07-30）══
//   ★これは「表示名」だけの写像。primaryTx/surgery/lymphNode/oncotype の内部値には一切触れない。
const CHIP_ONCO    = { "低リスク":"OncoDX低", "中リスク":"OncoDX中", "高リスク":"OncoDX高", "未施行":"OncoDX未" };
const CHIP_PRIMARY = { "手術":"手術先行", "術前化学療法":"PST", "術前化学内分泌療法":"PST" };  // PST=Primary Systemic Therapy（区別はsubtype badgeで補完）
const CHIP_SURGERY = { "温存":"手術温存", "全摘":"手術全摘", "未決定":"未決定", "非手術（薬物療法）":"非手術" };
const CHIP_LYMPH   = { "センチネル生検":"SNB", "腋窩郭清":"郭清", "両方":"SNB→郭清", "なし":"なし" };  // 両方＝SNB陽性時に郭清（→の因果）
const CHIP_PAL     = { op:{bg:"#eef5fd",bd:"#c9ddf3",fg:"#1a5fa8"}, sx:{bg:"#fbf3e8",bd:"#ecd2b3",fg:"#a05a00"}, _:{bg:"#f4f6fa",bd:"#e7ebf1",fg:"#3b4654"} };

// ── Main App ──────────────────────────────────────────────────────────
function App() {
  // ══ ①DL数カウンタ（謎の数字）の購読。初期null＝空白。読めない/未接続/オフラインでもnullのまま＝ヘッダ無表示 ══
  const [dlCount, setDlCount] = useState(null);
  useEffect(() => {
    if (!window._fs) return;
    let unsub;
    try {
      unsub = window._fs.doc("counters/global").onSnapshot(
        function (d) {
          const v = d && d.exists ? d.data().dl : null;
          setDlCount(typeof v === "number" ? v : null);
        },
        function () { /* 読取失敗も空白のまま（画面は無傷） */ }
      );
    } catch (e) { /* no-op */ }
    return () => { try { unsub && unsub(); } catch (e) {} };
  }, []);

  const [patientName, setPatientName] = useState("");
  const [age, setAge] = useState("");
  const [menopause, setMenopause] = useState(null);
  const [surgery, setSurgery] = useState(null);
  const [primaryTx, setPrimaryTx] = useState(null);
  const [lymphNode, setLymphNode] = useState(null);
  const [selT, setSelT] = useState(null);
  const [selT4sub, setSelT4sub] = useState(null);
  const [selN, setSelN] = useState(null);
  const [selM, setSelM] = useState(null);
  const [tumorSize, setTumorSize] = useState(null);
  const [lymphCount, setLymphCount] = useState(null);
  const [er, setEr] = useState(null);
  const [pr, setPr] = useState(null);
  const [her2, setHer2] = useState(null);
  const [grade, setGrade] = useState(null);
  const [ki67, setKi67] = useState(undefined);   // 【v2.1.35】初期値=未施行（Number(undefined)=NaN で低値誤判定を回避）。null/空/0 は不可
  const [oncotype, setOncotype] = useState(null);

  function tFromSize(mm) {
    if (mm === null) return null;
    if (mm === 0) return "T0";
    if (mm <= 20) return "T1";
    if (mm <= 50) return "T2";
    return "T3";
  }
  function nFromCount(n) {
    if (n === null) return null;
    if (n === 0) return "N0";
    if (n <= 3) return "N1";
    if (n <= 9) return "N2";
    return "N3";
  }

  // 【v2.1.15】単一ソース化：T/Nはそれぞれ「数値スライダー」と「フラグボタン」の2入力だが、
  //   活性値(activeT/activeN)は常にどちらか一方から一意に決まる（数値が入っていれば数値が上書き）。
  //   nCountは廃止（N1ボタン=1–3個と定義が確定・≥4はN2へ自動昇格）。
  const autoT = tFromSize(tumorSize);
  const autoN = nFromCount(lymphCount);
  const activeT = selT === "T4" ? "T4" : (tumorSize !== null ? autoT : selT);
  const activeN = lymphCount !== null ? autoN : selN;

  const anat      = getAnatomical(activeT, activeN, selM);
  const prog      = getPrognostic(anat, er, pr, her2, grade);
  const subtype   = getSubtype(er, pr, her2);
  const treatment = getTreatment(anat, subtype, ki67, activeN, activeT, grade, menopause, surgery, oncotype, primaryTx, lymphNode);

  const stageLabel = (anat && anat !== "invalid") ? `Stage ${anat}` : null;
  const stageColor = (anat && anat !== "invalid") ? (STAGE_COLOR[anat] || "#333") : "#ccc";
  const allTNM     = activeT && activeN && selM;
  const showProgNote  = allTNM && anat !== "invalid" && anat !== "0" && anat !== "IV" && prog && prog !== anat;
  const biomarkersComplete = anat === "0" ? true : (er !== null && her2 !== null && grade !== null);   // DCIS(0)はバイオマーカー入力の有無に関わらず治療方針以下を表示（v2.1.0）
  // 【v2.1.39・Request1(IwaoK 2026-07-27)】Stage I TNBC（IA/IB）は術前化学療法が非標準＝ボタン非表示。
  //   述語は getTreatment/buildSchedule と同一の isKeynote522StageEligible（教訓16：一述語を全層に通す）。
  // 【v2.1.44・Pending【U】・IwaoK決裁 2026-07-29】HER2+/HR+HER2+ の術前化学療法ボタンに T径ゲート（B案）。
  //   非表示は「真の低リスク」= T1a/T1b(≤10mm) かつ N0 のときだけ。節陽性(N1–3)は径によらず術前HP適応→表示。
  //   T2–4・T1c(≥11mm)も表示。mm未設定のT1×N0は安全側で非表示（tumorSize===null をこちらに含める・微決定1=隠す）。
  //   ★T1a/b/c N0 は全て Stage IA＝anatでは捕まえられない → tumorSize(mm) を直読（tFromSizeはT1止まり・教訓45）。
  const isNodePos    = activeN === "N1" || activeN === "N2" || activeN === "N3";
  const isSmallT1N0  = activeT === "T1" && (tumorSize === null || tumorSize <= 10) && !isNodePos;  // ＝真の低リスク＝非表示対象
  const her2NeoAdjOk = !isSmallT1N0;
  const showNeoAdj    = ((subtype === "HER2+" || subtype === "HR+/HER2+") && her2NeoAdjOk)
                      || (subtype === "TNBC" && isKeynote522StageEligible(anat));
  const showNeoAdjHR  = subtype === "HR+/HER2-" && ["T2","T3","T4"].includes(activeT);
  const isM1 = selM === "M1";

  useEffect(() => {

  function buildExportBasename() {
    const na = (v) => (v == null ? "na" : v);
    const tnm = `${na(activeT)}${na(activeN)}${na(selM)}`;
    const bio = `ER${na(er)}PgR${na(pr)}HER2${na(her2)}`;
    const d = new Date();
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    // "+"/"-" は可読なので残す。ファイル名に使えない "/ \ : * ? " < > |" のみ除去。
    return (`TNM_${tnm}_${bio}_${iso}`).replace(/[\/\\:*?"<>|]/g, "");
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ══ §UI【v2.2.1】Word専用の綺麗な文書ビルダー（B案・IwaoK決裁 2026-07-30）══
  //   方針：画面のライブUI（flex/grid＋入力ウィジェット）を丸ごと吐くのをやめ、Word互換（table/p/ul）で組む。
  //   ・上段（ヘッダ/Stage/TNM/臨床/バイオ/治療方向）は state から生成＝入力ボタン類は一切載せない。
  //   ・予後(PfsPanel)とスケジュール(table)は【ライブDOMを複製】して単一ソースを保つ（ロジック二重化=片肺を作らない・教訓16）。
  //     予後は sanitizeForWord で flex/grid解除＋視覚バー(.pfs-bar)除去。数値({item.pfs}%)も注記(適応外・Swain・出典)もテキストで残るため情報欠落なし。
  function sanitizeForWord(node) {
    // 視覚バーはトラックごと除去（数値はテキストで残る）
    node.querySelectorAll(".pfs-bar").forEach((el) => { const p = el.parentElement; (p || el).remove(); });
    node.querySelectorAll("*").forEach((el) => {
      const s = el.style; if (!s) return;
      const d = s.display;
      if (d === "flex" || d === "inline-flex" || d === "grid" || d === "inline-grid") s.display = "";  // 通常フローへ（団子化・崩れ防止）
      if (s.whiteSpace === "nowrap") s.whiteSpace = "normal";
      if (s.position === "sticky" || s.position === "fixed") s.position = "static";
      s.overflow = "";
    });
    return node;
  }

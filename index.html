    // ── Stage ──
    h += '<p style="margin:0 0 10px;">'
       + '<span style="font-size:21px;font-weight:800;color:' + (stageLabel ? stageColor : "#888") + ';">'
       + (anat === "invalid" ? "ステージ群外" : (stageLabel || "—")) + '</span>'
       + (subtype ? '　<span style="font-size:11px;background:#eef2f8;color:#556;border:1px solid #d6deea;border-radius:4px;padding:2px 8px;font-weight:700;">' + subtype + '</span>' : '')
       + (showProgNote ? '　<span style="font-size:11px;color:#777;">予後予測Stage：' + prog + '</span>' : '')
       + '</p>';
    // ── TNM ──
    h += '<table style="border-collapse:collapse;width:100%;margin:0 0 12px;">'
       + '<tr><td ' + tdL + '>T：' + esc(summaryTcode || "—") + '</td><td ' + td + '>' + esc(tDescFull || "—") + '</td></tr>'
       + '<tr><td ' + tdL + '>N：' + esc(activeN || "—") + '</td><td ' + td + '>' + esc(activeN ? N_DESC[activeN] : "—") + '</td></tr>'
       + '<tr><td ' + tdL + '>M：' + esc(selM || "—") + '</td><td ' + td + '>' + esc(selM ? M_DESC[selM] : "—") + '</td></tr>'
       + '</table>';
    // ── バイオマーカー ──
    h += '<p style="margin:0 0 12px;font-size:12px;"><b>バイオマーカー</b>　'
       + 'ER：' + bioWord(er) + '　／　PgR：' + bioWord(pr) + '　／　HER2：' + bioWord(her2) + '</p>';
    // ── 臨床情報 ──
    if (clin.length) {
      h += '<table style="border-collapse:collapse;width:100%;margin:0 0 14px;">';
      h += '<tr><td colspan="2" style="border:1px solid #c9d2e0;padding:5px 9px;background:#eef3fa;font-weight:700;color:#334;font-size:11px;">臨床情報</td></tr>';
      clin.forEach(([k, v]) => { h += '<tr><td ' + tdL + '>' + esc(k) + '</td><td ' + td + '>' + esc(v) + '</td></tr>'; });
      h += '</table>';
    }
    // ── 治療の方向性（treatment配列から再構成） ──
    h += '<div style="font-weight:800;font-size:13px;color:#fff;background:#2c3e6a;padding:5px 12px;border-radius:5px;display:inline-block;margin:6px 0 8px;">治療の方向性（参考）</div>';
    (isM1 ? treatment.concat([{ cat:"", items:[M1_LINE_DISCLAIMER] }]) : treatment).forEach((sec) => {
      if (sec.cat) h += '<p style="font-weight:700;color:#334;margin:8px 0 3px;font-size:12px;">' + esc(sec.cat) + '</p>';
      h += '<ul style="margin:0 0 6px 18px;padding:0;">'
         + sec.items.map((it) => '<li style="font-size:12px;line-height:1.7;color:#222;margin:2px 0;">' + nl2br(it) + '</li>').join("")
         + '</ul>';
    });
    h += '<p style="font-size:10px;color:#999;border-top:1px solid #eee;padding-top:6px;margin:6px 0 0;">治療方針の最終決定は腫瘍内科・集学的カンファレンスでの判断を優先してください。</p>';
    // ── 予後（ライブDOM複製＋サニタイズ） ──
    const pfsNode = document.getElementById("pfs-export");
    if (pfsNode) { const c = sanitizeForWord(pfsNode.cloneNode(true)); h += '<div style="margin-top:14px;">' + c.innerHTML + '</div>'; }
    // ── スケジュール（ライブDOM複製・tableはWord安全） ──
    const schedNode = document.getElementById("sched-export");
    if (schedNode) { const c = sanitizeForWord(schedNode.cloneNode(true)); h += '<div style="margin-top:14px;">' + c.innerHTML + '</div>'; }
    return h;
  }

  // ══ §UI【v2.4.0】レイサマリー（患者向け.txt）ビルダー ══
  //   B案：アプリが患者語まで作り、8B(Qwen)は最終整形のみ。単一ソース＝treatment[]（buildWordDocと同じstate）。M0専用。
  //   逐語厳守帯（薬剤名・年数・回数）はそのまま／医師フレーム（試験名・エビデンス・IITL注記）は落とす。
  function buildLaySummary() {
    if (!treatment || !biomarkersComplete || isM1) return null;   // M1は非対象（ボタンも非表示だが二重ガード）
    const L = [];
    // ── 8Bへの最小指示（制約の本体は Add Pal のシステムプロンプト側に焼く二段構え）──
    L.push("〔次の材料を、患者さんにやさしい文章に言い換えてください。");
    L.push("　あなたの仕事は言い換えだけで、新しいことは足さず、書いてあることは一つも省かず（要約もせず）、事実は一字も変えません。");
    L.push("　ただし「ことばの説明」の枠内は、すでに整えてある説明文です。言い換えず、そのまま載せてください。");
    L.push("　「はい」などの返事や前置きは書かず、本文からはじめてください〕");
    L.push("");
    // ── 状態（言い換え可帯・state から患者語）──
    L.push("■ あなたの乳がんの状態");
    // ① ステージ
    if (anat && anat !== "invalid" && LAY_STAGE[anat]) L.push("・ステージ：" + LAY_STAGE[anat] + (LAY_STAGE_EARLY[anat] ? "（早期）" : ""));
    // ② 広がり＝各項目の頭にTNMコードを前置（独立TNM行を廃止しここへ統合・IwaoK決裁 2026-08-11）。
    //   コード＝患者の記録/他院受診用、説明＝患者語。T4は細分(T4d等)を summaryTcode 同ロジックで拾う。
    const tCode = activeT === "T4" ? (selT4sub || "T4") : activeT;
    const spread = [];
    if (tCode && LAY_T[activeT]) spread.push(tCode + " " + LAY_T[activeT]);
    if (activeN && LAY_N[activeN]) spread.push(activeN + " " + LAY_N[activeN]);
    spread.push((selM ? selM + " " : "") + "遠くの臓器への転移はありません");
    if (spread.length) L.push("・広がり：" + spread.join("／"));
    // ③ タイプ
    if (subtype && LAY_SUBTYPE[subtype]) L.push("・タイプ：" + LAY_SUBTYPE[subtype]);
    L.push("");
    // ── 治療（逐語厳守帯・treatment[]を単一ソースに縮約列挙）──
    L.push("■ これからの治療の見通し〔薬の名前・数字・年数はそのまま〕");
    const neoLine = layNeoAdjFrame(subtype, anat, primaryTx, activeT);   // ★v2.5.0 術前の時系列フレームを前置（HOTL・薬剤名は下の逐語帯が保持）
    if (neoLine) L.push(neoLine);
    // ★v2.5.2 入力ボタン書き起こし：侵襲がんの局所療法ブロックで、手術行の直後に選択リンパ節処理を挿入（HOTL）。
    //   DCIS(anat==="0")は getTreatment が既に lymph 行を出すため二重回避。未選択(null)は何も足さない。
    const lymphLine = anat !== "0" ? layLymphLine(lymphNode) : null;
    let lymphDone = false;
    treatment.forEach((sec) => {
      if (sec.pending) return;                                        // Ki-67待ち等の保留ブロックごとスキップ
      (sec.items || []).forEach((it) => {
        const first = String(it == null ? "" : it).split("\n")[0];    // 1行目＝薬剤の核（evText埋め込みの2行目以降は捨てる）
        if (/^【参考値】/.test(first)) return;                          // 独立evText要素（先頭が参考値）は丸ごとスキップ
        const s = laySimplifyTx(first);                               // 末尾の試験名括弧・【】注記のみ除去（薬剤名は不変）
        if (s && !isLayTxNoise(s)) {
          const isSurgeryLine = sec.cat === "局所療法" && /^手術/.test(s);
          let sDisp = s;
          if (isSurgeryLine) {
            if (surgery === "温存") sDisp = "乳房を残す手術（乳房温存術）";
            else if (surgery === "全摘") sDisp = "乳房をすべて取る手術（乳房全摘術）。ご希望に応じて乳房の再建も相談できます";
          }
          L.push("・" + sDisp);
          if (!lymphDone && lymphLine && isSurgeryLine) {   // 手術行の直後にリンパ節処理を書き起こす
            L.push("・" + lymphLine);
            lymphDone = true;
          }
        }
      });
    });
    if (lymphLine && !lymphDone) L.push("・" + lymphLine);              // 手術行が出ない経路（術前提示等）でも、選択は落とさない
    L.push("");
    // ── これからの見通し（予後・v2.4.2）＝IwaoK決裁 2026-08-11 論点1-4。単一ソース＝PFS_DATA（読むだけ）──
    const progLines = buildPrognosisLines(subtype, anat, primaryTx);
    if (progLines.length) {
      L.push("■ これからの見通し");
      progLines.forEach((x) => L.push(x));
      if (progLines.some((x) => /割/.test(x))) {
        L.push("（この数値は主要な臨床試験をもとにしたおおよその目安で、実際は一人ひとりの状況で異なります）");
      }
    }
    // ── 励まし（言い換え可帯・subtype別）──
    L.push("");
    L.push("■ お伝えしたいこと");
    if (subtype && LAY_CLOSING[subtype]) L.push(LAY_CLOSING[subtype]);
    // ── ことばの説明（定義ブロック・v2.5.1）＝ここまで組んだ本文に出た用語だけ、整形対象外の定義を末尾に添える ──
    const glossary = buildLayGlossary(L.join("\n"), { her2Positive: subtype === "HER2+" || subtype === "HR+/HER2+" });
    if (glossary) { L.push(""); glossary.forEach((g) => L.push(g)); }
    L.push("");
    L.push("※このテキストは、担当医と一緒に読むための下書きです。最終的な内容は担当医が確認します。");
    return L.join("\n");
  }

  function exportText() {
    const txt = buildLaySummary();
    if (!txt) return;
    // BOM付きUTF-8＝iOS/各エディタでの文字化け防止（Word出力と同型）
    triggerDownload(new Blob(["\ufeff", txt], { type: "text/plain;charset=utf-8" }), buildExportBasename() + ".txt");
    bumpDL();  // ①実際に.txtを生成＝DLする時のみ +1（fire-and-forget・Word/HTMLと同型）
  }

  function exportWord() {
    const inner = buildWordDoc();
    if (!inner) return;
    bumpDL();  // ①実際にWordを生成＝DLする時のみ +1（fire-and-forget）
    const html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>乳がん TNM分類・治療方針案</title>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View>' +
      '<w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->' +
      '<style>body{font-family:"Yu Gothic","Meiryo","Hiragino Sans",sans-serif;font-size:12px;color:#222;}' +
      '@page{size:A4;margin:1.6cm;}table{border-collapse:collapse;}</style></head><body>' +
      inner + buildDisclaimer(".doc") +
      '</body></html>';
    triggerDownload(new Blob(['\ufeff', html], { type: "application/msword" }), buildExportBasename() + ".doc");  // BOMでWordのUTF-8認識を安定化
  }

  // 【v2.1.20】HTML出力：無劣化コピー。アプリの背景色・PFSバーのgrow CSSも同梱し「このまま」の見た目を再現。
  //   このHTMLをブラウザで開いて「印刷→PDFで保存」すれば、結果パネルそのままの綺麗なPDFになる（＝旧PDFボタンの代替）。
  function exportHtml() {
    const body = buildResultBody();
    if (!body) return;
    bumpDL();  // ①実際にHTMLを生成＝DLする時のみ +1（fire-and-forget）
    const html =
      '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>乳がん TNM分類・治療方針案</title>' +
      '<style>*{box-sizing:border-box;margin:0;padding:0;}' +
      'body{background:#f0f2f5;font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;' +
      'color:#222;padding:18px 12px 48px;}.wrap{max-width:520px;margin:0 auto;}' +
      '@keyframes barGrow{from{width:0}to{width:var(--bar-w)}}.pfs-bar{animation:barGrow 0.6s ease forwards;}' +
      '@media print{body{background:#fff;padding:0;}.wrap{max-width:100%;}}</style></head><body>' +
      '<div class="wrap">' + body.header + body.inner + buildDisclaimer(".html") + '</div>' +
      '</body></html>';
    triggerDownload(new Blob([html], { type: "text/html;charset=utf-8" }), buildExportBasename() + ".html");
  }

  const hasInput = activeT||activeN||selM||er||pr||her2||grade||patientName||age||menopause||surgery||primaryTx||lymphNode;
  const today = new Date().toLocaleDateString("ja-JP", { year:"numeric", month:"long", day:"numeric" });
  const showSchedule = treatment && biomarkersComplete && (primaryTx || surgery);
  // 5年PFSパネルはバイオマーカー確定後に表示
  const showPfs = biomarkersComplete && subtype && anat && anat !== "invalid" && anat !== "0" && anat !== "IV";

  // ══ §UI【v2.2.0】固定サマリー用の派生値（表示のみ・ロジック非介入・IwaoK決裁 2026-07-30）══
  //   TコードはT4のときサブ分類を優先（T4d等）＝サマリーは説明文でなくコードで一望する。
  const summaryTcode = activeT === "T4" ? (selT4sub || "T4") : activeT;
  const ki67Filled = ki67 !== undefined && ki67 !== null && !Number.isNaN(Number(ki67));
  const _pal = (a) => CHIP_PAL[a || "_"];
  // ラベル常時型（filledでも「核G」「Ki-67」の接頭を残す）
  const chipLabeled = (k, v, filled, a=null) => ({ k, v: filled ? v : "—", filled, ..._pal(a) });
  // 値一体型（filled時は短縮値を1語で／未入力時はフィールド名＋点線）
  const chipSolo = (field, v, filled, a=null) => filled ? { k:"", v, filled:true, ..._pal(a) } : { k:field, v:"—", filled:false, ..._pal(a) };
  const summaryChips = [
    chipLabeled("核G", grade === "未施行" ? "未" : `G${grade}`, !!grade),
    chipLabeled("Ki-67", `${ki67}%`, ki67Filled),
    chipSolo("OncoDX", CHIP_ONCO[oncotype], oncotype != null),
    chipSolo("閉経", menopause, !!menopause),
    chipSolo("初回", CHIP_PRIMARY[primaryTx], !!primaryTx, "op"),
    chipSolo("術式", CHIP_SURGERY[surgery], !!surgery, "sx"),
    chipSolo("リンパ", CHIP_LYMPH[lymphNode], !!lymphNode, "sx"),
  ];

  return (
    <div style={{ minHeight:"100vh", display:"flex", justifyContent:"center", padding:"18px 12px 60px" }}>
      <div style={{ width:"100%", maxWidth:520 }} id="print-area">

        {/* ══ §UI【v2.2.0】固定サマリー（IwaoK指示 2026-07-30）══
             タイトル行＋Stage＋TNMコード＋臨床チップを1枚のstickyカードに統合し、スクロールしても上に残す。
             ★旧メインカードは overflow:hidden で内側のstickyが効かないため、サマリーを独立カードに分離した。
             ★TNMは説明文でなくコード（T4d/N1/M1）で一望。各コードの説明は各入力欄の「→」行が担う（N・Mと対称）。 */}
        <div style={{ position:"sticky", top:8, zIndex:30, background:"#fff", borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.10)", border:"1px solid #eef1f5", padding:"9px 14px 10px", marginBottom:12 }}>

          {/* タイトル行（一行・固定・氏名年齢は廃止） */}
          <div style={{ display:"flex", alignItems:"baseline", gap:8, whiteSpace:"nowrap", overflow:"hidden", paddingBottom:7, marginBottom:8, borderBottom:"1px solid #eaeef3" }}>
            <span style={{ fontSize:13, fontWeight:800, color:"#222", overflow:"hidden", textOverflow:"ellipsis" }}>乳がん TNM分類・治療方針案</span>
            <span style={{ marginLeft:"auto", fontSize:10.5, color:"#aab2bd", flexShrink:0 }}>{APP_VER.replace(/^v/, "ver")}　<span style={{ color:"#8a94a0", fontWeight:700 }}>@IwaoK</span>{dlCount!=null && <span style={{ color:"#c4ccd6", fontWeight:700 }}> · {dlCount}</span>}</span>
          </div>

          {/* Stage行 */}
          <div style={{ display:"flex", alignItems:"baseline", gap:9, flexWrap:"wrap" }}>
            <div style={{ fontSize:stageLabel?29:16, fontWeight:800, color:stageLabel?stageColor:"#ccc", lineHeight:1 }}>
              {anat==="invalid"?"—":stageLabel??"—"}
            </div>
            {anat==="invalid"&&allTNM&&<div style={{ fontSize:12, color:"#a04000" }}>AJCC 8版のステージ群に収載されていません</div>}
            {showProgNote&&<div style={{ fontSize:11, color:"#999" }}>予後予測Stage: <b style={{ color:STAGE_COLOR[prog]??"#555" }}>{prog}</b></div>}
            {allTNM&&anat!=="invalid"&&anat!=="0"&&anat!=="IV"&&!prog&&<div style={{ fontSize:11, color:"#bbb" }}>← バイオマーカーで補正可</div>}
            {subtype&&<span style={{ fontSize:11, background:"#f0f4fa", color:"#558", borderRadius:4, padding:"2px 7px", fontWeight:700 }}>{subtype}</span>}
          </div>

          {/* T/N/M コード（一行） */}
          <div style={{ display:"flex", alignItems:"baseline", gap:8, marginTop:7, whiteSpace:"nowrap", overflow:"hidden", fontSize:14 }}>
            {[summaryTcode, activeN, selM].map((code,i)=>(
              <React.Fragment key={i}>
                {i>0 && <span style={{ color:"#dde", fontSize:13 }}>/</span>}
                <span style={{ fontWeight:800, color:code?"#1a5fa8":"#cfd4da" }}>{code||"—"}</span>
              </React.Fragment>
            ))}
          </div>

          {/* 臨床チップ（入力済み=色付き／未入力=点線＝「どれを入れたか」が見える） */}
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:9, paddingTop:8, borderTop:"1px dashed #eceff3" }}>
            {summaryChips.map((c,i)=>(
              <span key={i} style={{
                fontSize:11, lineHeight:1, padding:"5px 8px", borderRadius:6, display:"inline-flex", alignItems:"center", gap:4,
                background:c.filled ? c.bg : "transparent",
                border:c.filled ? `1px solid ${c.bd}` : "1px dashed #d7dbe1",
              }}>
                {c.k && <span style={{ color:"#98a1ae", fontWeight:600 }}>{c.k}</span>}
                <span style={{ color:c.filled ? c.fg : "#c3c8d0", fontWeight:c.filled ? 700 : 500 }}>{c.v}</span>
              </span>
            ))}
          </div>
        </div>

        {/* 入力カード（旧メインカード：Stage表示と患者情報は上のサマリーへ移動／廃止） */}
        <div style={{ background:"#fff", borderRadius:14, boxShadow:"0 2px 12px rgba(0,0,0,0.08)", overflow:"hidden" }}>

          <div style={{ padding:"16px 20px", display:"flex", flexDirection:"column", gap:14 }}>

            {/* TNM */}
            <Divider title={<>TNM 分類　<span style={{ textTransform:"none" }}>（AJCC 8th）</span></>} />

            {/* T */}
            <div>
              <RowLabel>T — 原発腫瘍</RowLabel>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:10, background:"#f8faff", borderRadius:8, padding:"8px 10px" }}>
                <span style={{ fontSize:11, fontWeight:700, color:"#888", minWidth:58 }}>浸潤径</span>
                <button onClick={()=>applyTumorSize(v => v===null?20:Math.max(1,v-1))} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:"#fff", cursor:"pointer", fontSize:12 }}>◀</button>
                <div style={{ position:"relative", flex:1 }}>
                  <input type="range" min={1} max={80} value={tumorSize ?? 20} disabled={tumorSize===null}
                    onChange={e=>applyTumorSize(Number(e.target.value))}
                    style={{ width:"100%", accentColor:"#1a5fa8", cursor:tumorSize===null?"not-allowed":"pointer", opacity:tumorSize===null?0.4:1 }} />
                  {[20,50].map(v=>(
                    <div key={v} style={{ position:"absolute", top:-4, left:`${((v-1)/79)*100}%`, transform:"translateX(-50%)", width:2, height:8, background:"#e07030", borderRadius:1 }} />
                  ))}
                </div>
                <button onClick={()=>applyTumorSize(v => v===null?20:Math.min(80,v+1))} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:"#fff", cursor:"pointer", fontSize:12 }}>▶</button>
                <span style={{ fontSize:13, fontWeight:700, minWidth:48, textAlign:"right", color:"#1a5fa8" }}>
                  {tumorSize===null ? "—" : `${tumorSize} mm`}
                </span>
                <button onClick={()=>setTumorSize(null)} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:tumorSize===null?"#f5f5f5":"#fff", color:tumorSize===null?"#ccc":"#888", cursor:tumorSize===null?"not-allowed":"pointer", fontSize:11 }}>クリア</button>
              </div>
              <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                {T_ITEMS.map(t=>(
                  <TnmBtn key={t} label={t} active={activeT===t} onToggle={()=>{
                    // 統一ハンドラ：現在の活性値(activeT)基準でトグル。ボタンを押したら数値スライダーはクリア（同期上書き）。
                    const on = activeT===t;
                    setSelT(on ? null : t);
                    setTumorSize(null);
                    if (on || t !== "T4") setSelT4sub(null);   // T4以外を選ぶ/T4を外す→亜分類をクリア
                  }} />
                ))}
              </div>
              {activeT === "T4" && (
                <div style={{ marginTop:7, display:"flex", gap:5, flexWrap:"wrap" }}>
                  {["T4a","T4b","T4c","T4d"].map(sub=>(
                    <button key={sub} onClick={()=>setSelT4sub(selT4sub===sub?null:sub)} style={{
                      padding:"5px 10px", borderRadius:6, fontSize:12,
                      border:selT4sub===sub?"2px solid #b03000":"2px solid #f0d0c0",
                      background:selT4sub===sub?"#b03000":"#fff8f5", color:selT4sub===sub?"#fff":"#a03000", fontWeight:selT4sub===sub?700:500, cursor:"pointer",
                    }}>{sub}</button>
                  ))}
                </div>
              )}
              {activeT && activeT !== "T4" && (
                <div style={{ marginTop:5, fontSize:11, color:"#888" }}>→ {T_DESC[activeT]}</div>
              )}
              {/* ★v2.2.0 T4サブ選択時の説明行（N・Mと対称化＝片肺の補修・IwaoK決裁 2026-07-30）。
                  サマリーをコード化した代わりに、T4d等の説明はここで担保する（サブ未選択時はT4総論を出す）。 */}
              {activeT === "T4" && (
                <div style={{ marginTop:5, fontSize:11, color:"#a03000" }}>→ {selT4sub ? T4_SUB_DESC[selT4sub] : T_DESC["T4"]}</div>
              )}
            </div>

            {/* N */}
            <div>
              <RowLabel>N — リンパ節</RowLabel>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:10, background:"#f8faff", borderRadius:8, padding:"8px 10px" }}>
                <span style={{ fontSize:11, fontWeight:700, color:"#888", minWidth:58 }}>pN個数</span>
                <button onClick={()=>applyLymphCount(v => v===null?0:Math.max(0,v-1))} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:"#fff", cursor:"pointer", fontSize:12 }}>◀</button>
                <div style={{ position:"relative", flex:1 }}>
                  <input type="range" min={0} max={20} value={lymphCount ?? 0} disabled={lymphCount===null}
                    onChange={e=>applyLymphCount(Number(e.target.value))}
                    style={{ width:"100%", accentColor:"#1a5fa8", cursor:lymphCount===null?"not-allowed":"pointer", opacity:lymphCount===null?0.4:1 }} />
                  {[1,4,10].map(v=>(
                    <div key={v} style={{ position:"absolute", top:-4, left:`${(v/20)*100}%`, transform:"translateX(-50%)", width:2, height:8, background:"#e07030", borderRadius:1 }} />
                  ))}
                </div>
                <button onClick={()=>applyLymphCount(v => v===null?0:Math.min(20,v+1))} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:"#fff", cursor:"pointer", fontSize:12 }}>▶</button>
                <span style={{ fontSize:13, fontWeight:700, minWidth:36, textAlign:"right", color:"#1a5fa8" }}>
                  {lymphCount===null ? "—" : `${lymphCount}個`}
                </span>
                <button onClick={()=>setLymphCount(null)} style={{ padding:"2px 8px", borderRadius:6, border:"1px solid #d4dae4", background:lymphCount===null?"#f5f5f5":"#fff", color:lymphCount===null?"#ccc":"#888", cursor:lymphCount===null?"not-allowed":"pointer", fontSize:11 }}>クリア</button>
              </div>
              <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                {N_ITEMS.map(n=>(
                  <TnmBtn key={n} label={n} active={activeN===n} onToggle={()=>{
                    // 統一ハンドラ：activeN基準でトグル。ボタンを押したら個数スライダーはクリア（同期上書き）。
                    const on = activeN===n;
                    setLymphCount(null);
                    setSelN(on ? null : n);
                  }} />
                ))}
              </div>
              {/* 【v2.1.15】N1個数(1-3/4+)セグメントは廃止。個数≥4はN2へ自動昇格するため
                  「N1かつ4個」が構造的に生成不能となり、旧セグメントは不要（③）。 */}
              {activeN && <div style={{ marginTop:5, fontSize:11, color:"#888" }}>→ {N_DESC[activeN]}</div>}
            </div>

            {/* M */}
            <div>
              <RowLabel>M — 遠隔転移</RowLabel>
              <div style={{ display:"flex", gap:5 }}>
                {M_ITEMS.map(m=>(
                  <TnmBtn key={m} label={m} active={selM===m} onToggle={()=>setSelM(selM===m?null:m)} />
                ))}
              </div>
              {selM && <div style={{ marginTop:5, fontSize:11, color:selM==="M1"?"#a02000":"#888" }}>→ {M_DESC[selM]}</div>}
            </div>

            {/* Biomarkers */}
            {allTNM && anat !== "invalid" && (
              <>
                <Divider title="バイオマーカー" />
                <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                  <PlusMinus label="ER" value={er} onChange={setEr} />
                  <PlusMinus label="PgR" value={pr} onChange={setPr} />
                  <PlusMinus label="HER2" value={her2} onChange={setHer2} />
                </div>
                <div>
                  <RowLabel>Grade（核グレード）</RowLabel>
                  <SegBtn options={["1","2","3","未施行"]} value={grade} onChange={setGrade} small />
                </div>
                <Ki67Slider value={ki67} onChange={setKi67} />
              </>
            )}

            {/* Oncotype DX */}
            {biomarkersComplete && isOncotypeDxEligible(subtype, activeN, grade, ki67) && !isM1 && (
              <div>
                <RowLabel>Oncotype DX（術前は医療保険未承認）</RowLabel>
                <SegBtn options={["低リスク","中リスク","高リスク","未施行"]} value={oncotype} onChange={setOncotype} small />
              </div>
            )}

            {/* Menopause */}
            {biomarkersComplete && (
              <div>
                <RowLabel>閉経状況</RowLabel>
                <SegBtn options={["閉経前","閉経後"]} value={menopause} onChange={setMenopause} />
              </div>
            )}

            {/* Primary treatment */}
            {biomarkersComplete && !isM1 && (
              <div>
                <RowLabel>初回治療方針</RowLabel>
                <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
                  <button onClick={()=>setPrimaryTx(primaryTx==="手術"?null:"手術")} style={{
                    padding:"8px 18px", borderRadius:8,
                    border:primaryTx==="手術"?"2px solid #1a5fa8":"2px solid #d4dae4",
                    background:primaryTx==="手術"?"#1a5fa8":"#fff", color:primaryTx==="手術"?"#fff":"#444",
                    fontSize:13, fontWeight:primaryTx==="手術"?700:500, cursor:"pointer",
                  }}>手術（先行）</button>
                  {showNeoAdj && (
                    <button onClick={()=>setPrimaryTx(primaryTx==="術前化学療法"?null:"術前化学療法")} style={{
                      padding:"8px 18px", borderRadius:8,
                      border:primaryTx==="術前化学療法"?"2px solid #b03000":"2px solid #d4dae4",
                      background:primaryTx==="術前化学療法"?"#b03000":"#fff",
                      color:primaryTx==="術前化学療法"?"#fff":"#b03000",
                      fontSize:13, fontWeight:primaryTx==="術前化学療法"?700:500, cursor:"pointer",
                    }}>術前化学療法（ネオアジュバント）</button>
                  )}
                  {/* 【v2.1.44・Pending【U】】明示的沈黙の注記（沈黙させない・教訓8）。isSmallT1N0 はボタン非表示条件と単一述語で対称（教訓16）。
                      径確定＝理由説明／mm未設定＝それとなく条件案内（微決定2・IwaoK決裁 2026-07-29）。 */}
                  {(subtype === "HER2+" || subtype === "HR+/HER2+") && isSmallT1N0 && (
                    <div style={{ fontSize:11, color:"#7a4400", background:"#fff6ea", border:"1px solid #e6c48a",
                      borderRadius:6, padding:"6px 10px", lineHeight:1.6, width:"100%" }}>
                      {tumorSize !== null
                        ? "腫瘍径 ≤10mm（T1a/T1b・N0）では術前化学療法は標準的でないため、選択肢に出していません"
                        : "腫瘍径（mm）は未入力です。T1c（11mm以上）または節転移陽性（N+）で術前化学療法が選択肢に出ます"}
                    </div>
                  )}
                  {showNeoAdjHR && (
                    <button onClick={()=>setPrimaryTx(primaryTx==="術前化学内分泌療法"?null:"術前化学内分泌療法")} style={{
                      padding:"8px 18px", borderRadius:8,
                      border:primaryTx==="術前化学内分泌療法"?"2px solid #6a1a8a":"2px solid #d4dae4",
                      background:primaryTx==="術前化学内分泌療法"?"#6a1a8a":"#fff",
                      color:primaryTx==="術前化学内分泌療法"?"#fff":"#6a1a8a",
                      fontSize:13, fontWeight:primaryTx==="術前化学内分泌療法"?700:500, cursor:"pointer",
                    }}>術前化学療法（HR+/HER2-）</button>
                  )}
                </div>
              </div>
            )}

            {/* Surgery */}
            {biomarkersComplete && (
              <div>
                <RowLabel>乳房手術術式</RowLabel>
                {/* 【v2.1.4】M1: 従来は「非手術」固定表示だったが、遠隔転移例でも局所制御・症状緩和目的の手術はありうる（IwaoK）。
                    選択可能にしつつ、スケジュールは buildSchedule の isPalliative で常に緩和的1次治療枝に固定される。
                    【v2.1.33・M0非手術の取り下げ・IwaoK決裁 2026-07-24】M0の「非手術（薬物療法）」は【削除】した。
                    ★v2.1.4 で「高齢・寝たきり・皮膚浸潤等で非切除とする例がある」ため追加した判断を【取り下げる】（採用の記録と同じ重さで残す＝教訓6）。
                      取り下げの理由：M0非手術は isPalliative の第2項＝M1用の緩和枝を借りていた。その結果、非転移のM0浸潤癌に
                      2次治療・3次治療・耐性後（エンハーツ等）という【転移乳癌のライン戦略】が出ていた（実機発見・IwaoK 2026-07-24）。
                      ＝POTENT×IIIC（教訓16）より危険側の「別の病気の治療を出す」型。DCISでは非手術と未決定の出力が既に同一だった。
                    ★M0非切除例そのものが臨床に存在しないという主張ではない。専用枝（案②）を作らず「未決定」に集約すると決めた
                      ＝その患者が来たときに医師が個別に考える（PITL/IITL）。按分カタログを増やさない選択（わがまま😌・不採用の記録）。 */}
                <SegBtn options={isM1 ? ["非手術（薬物療法）","温存","全摘"] : ["温存","全摘","未決定"]} value={surgery} onChange={setSurgery} />
                {isM1 && surgery && surgery !== "非手術（薬物療法）" && (
                  <div style={{ marginTop:6, padding:"7px 10px", background:"#fff4e5", border:"1px solid #f0c891", borderRadius:6, fontSize:12, color:"#7a4a00", lineHeight:1.6 }}>
                    遠隔転移がある場合の手術は、局所の症状をやわらげる・局所を抑える目的で行います。再発予防のための「術後の追加治療」は行わず、全身の薬物療法（緩和的1次治療）が治療の中心になります。
                  </div>
                )}
              </div>
            )}

            {/* Lymph node */}
            {biomarkersComplete && !isM1 && (
              <div>
                <RowLabel>リンパ節処理</RowLabel>
                <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
                  {[
                    { label:"センチネルリンパ節生検", val:"センチネル生検", color:"#1a5fa8" },
                    { label:"腋窩リンパ節郭清", val:"腋窩郭清", color:"#883000" },
                    { label:"生検＋郭清（両方）", val:"両方", color:"#6a006a" },
                    ...(anat === "0" ? [{ label:"施行しない", val:"なし", color:"#5a6a7a" }] : []),
                  ].map(({ label, val, color }) => (
                    <button key={val} onClick={()=>setLymphNode(lymphNode===val?null:val)} style={{
                      padding:"7px 14px", borderRadius:8,
                      border:lymphNode===val?`2px solid ${color}`:"2px solid #d4dae4",
                      background:lymphNode===val?color:"#fff", color:lymphNode===val?"#fff":"#555",
                      fontSize:12, fontWeight:lymphNode===val?700:500, cursor:"pointer", whiteSpace:"nowrap",
                    }}>{label}</button>
                  ))}
                </div>
                {lymphNode && (
                  <div style={{ marginTop:7, fontSize:11, lineHeight:1.75, padding:"8px 12px", borderRadius:7,
                    background: lymphNode==="センチネル生検"?"#f4f8ff": lymphNode==="腋窩郭清"?"#fff5f0": lymphNode==="なし"?"#f4f6f8":"#f8f0ff",
                    border: lymphNode==="センチネル生検"?"1px solid #d0e4f8": lymphNode==="腋窩郭清"?"1px solid #f0c8b0": lymphNode==="なし"?"1px solid #d8dee4":"1px solid #e0c0f0",
                    color: lymphNode==="センチネル生検"?"#334488": lymphNode==="腋窩郭清"?"#883000": lymphNode==="なし"?"#44515e":"#552266",
                  }}>
                    {lymphNode === "センチネル生検" && "腋窩に最初に流れる「見張りリンパ節」を手術中に取り出して調べます。転移がなければ郭清は省略できます（リンパ浮腫リスク約5%）。"}
                    {lymphNode === "腋窩郭清" && "腋窩のリンパ節を広範囲に取り除きます。リンパ浮腫（腕のむくみ）のリスクがあります（15〜25%）。術後リハビリテーションが重要です。"}
                    {lymphNode === "両方" && "センチネルリンパ節生検を行い、術中迅速病理で転移が確認された場合に続けて腋窩リンパ節郭清を行います。"}
                    {lymphNode === "なし" && "リンパ節の手術（センチネルリンパ節生検）は行いません。非浸潤癌（DCIS）で乳房温存の場合、リンパ節転移の可能性が低いため省略できます（全摘や広範囲のDCISでは実施を検討します）。"}
                  </div>
                )}
              </div>
            )}

            {hasInput && (
              <div style={{ textAlign:"right" }}>
                <button onClick={handleReset} className="no-print" style={{ padding:"5px 16px", borderRadius:20, border:"1px solid #d0d0d0", background:"#fff", color:"#999", fontSize:12, cursor:"pointer" }}>リセット</button>
              </div>
            )}

            {/* Treatment direction */}
            {treatment && biomarkersComplete && (
              <>
                <Divider title="治療の方向性（参考）" />
                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                  {(isM1 ? treatment.concat([{ cat:"", items:[M1_LINE_DISCLAIMER] }]) : treatment).map((sec,i)=>(
                    <div key={i} style={{ background:sec.color||"#f8faff", borderRadius:8, padding:"10px 12px", border:sec.border||"1px solid #e8eef8" }}>
                      {sec.cat && <div style={{ fontSize:11, fontWeight:700, color:"#334", marginBottom:6 }}>{sec.cat}</div>}
                      <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                        {sec.items.map((item,j)=>(
                          <div key={j} style={{ display:"flex", gap:6, alignItems:"flex-start" }}>
                            <span style={{ color:"#1a5fa8", fontSize:11, marginTop:2, flexShrink:0 }}>▸</span>
                            <span style={{ fontSize:12, color:"#333", lineHeight:1.7, whiteSpace:"pre-line" }}>{item}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize:10, color:"#bbb", borderTop:"1px solid #f0f0f0", paddingTop:8, lineHeight:1.8 }}>
                  治療方針の最終決定は腫瘍内科・集学的カンファレンスでの判断を優先してください。
                </div>
              </>
            )}

            {/* ── 5年PFSパネル ──（id=pfs-export：Word出力が複製する目印） */}
            {showPfs && (
              <div id="pfs-export">
                <Divider title="治療別の予後（時点は各項に明記）" />
                <PfsPanel
                  anat={anat} subtype={subtype} menopause={menopause}
                  primaryTx={primaryTx} surgery={surgery}
                  n={activeN} t={activeT} grade={grade} ki67={ki67}
                />
              </div>
            )}

            {/* Treatment schedule（id=sched-export：Word出力が複製する目印） */}
            {showSchedule && (
              <div id="sched-export">
                <TreatmentScheduleTable
                  primaryTx={primaryTx} subtype={subtype}
                  surgery={surgery} lymphNode={lymphNode} menopause={menopause}
                  anat={anat} n={activeN} t={activeT} grade={grade} ki67={ki67}
                />
              </div>
            )}

            {/* Export buttons（🌐HTML＝無劣化・印刷でPDF可／📝Word＝編集用.doc・2ボタン構成 v2.1.20）*/}
            {treatment && biomarkersComplete && (
              <div className="no-print" style={{ marginTop:8, display:"flex", gap:8, flexWrap:"wrap" }}>
                <button
                  onClick={exportHtml}
                  style={{
                    flex:"1 1 180px", padding:"12px", borderRadius:10, border:"none",
                    background:"linear-gradient(135deg, #2a7a4a 0%, #3a9a5a 100%)",
                    color:"#fff", fontSize:14, fontWeight:700, cursor:"pointer",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:8,
                    boxShadow:"0 3px 10px rgba(42,122,74,0.3)",
                  }}>
                  🌐 HTML で保存
                </button>
                <button
                  onClick={exportWord}
                  style={{
                    flex:"1 1 180px", padding:"12px", borderRadius:10, border:"none",
                    background:"linear-gradient(135deg, #1a5fa8 0%, #2a7fc8 100%)",
                    color:"#fff", fontSize:14, fontWeight:700, cursor:"pointer",
                    display:"flex", alignItems:"center", justifyContent:"center", gap:8,
                    boxShadow:"0 3px 10px rgba(26,95,168,0.3)",
                  }}>
                  📝 Word（.doc）で保存
                </button>
                {/* 📄レイサマリー(.txt)＝iPhone完結・8B(Qwen)へ渡す患者向け素材（v2.4.0・M0専用）。M1では非表示＝再発転移カタログは1枚説明書に不向き */}
                {!isM1 && (
                  <button
                    onClick={exportText}
                    style={{
                      flex:"1 1 180px", padding:"12px", borderRadius:10, border:"none",
                      background:"linear-gradient(135deg, #c2691a 0%, #e08a2e 100%)",
                      color:"#fff", fontSize:14, fontWeight:700, cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"center", gap:8,
                      boxShadow:"0 3px 10px rgba(194,105,26,0.3)",
                    }}>
                    📄 レイサマリー素材(.txt)
                  </button>
                )}
              </div>
            )}

          </div>
        </div>

        {/* ③バグ報告＝Googleフォーム（既存「いいとこ探し」と同型・回答はGoogleがIwaoKへメール通知／PHIはフォーム側の「※患者情報は書かないでください」で入口封じ） */}
        <div style={{ marginTop:6, textAlign:"center" }} className="no-print">
          <a href="https://forms.gle/U3gcrq3UQAvKWqc97" target="_blank" rel="noopener"
             style={{ fontSize:11, color:"#aab2bd", textDecoration:"none" }}>ご意見・不具合など📝</a>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
/* PWA: Service Worker登録（Reactの初期化は上記babelブロックで完了済み・削除しないこと） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js')
      .catch(function (e) { console.log('SW registration failed:', e); });
  });
}
</script>
</body>
</html>
